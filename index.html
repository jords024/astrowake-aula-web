<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Astrowake — Hackeando a Realidade (Apresentação Ao Vivo • Google Meet)</title>
  <style>
    :root {
      --bg-dark: #0A0B0E;
      --card-dark: #12141A;
      --offwhite: #F4F3EF;
      --amber: #E8A838;
      --copper: #C65C20;
      --line-dark: #2C303A;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }
    html, body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background-color: var(--bg-dark);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      color: var(--offwhite);
    }

    /* Main Stage Container - Fits 16:9 perfectly on any screen for Google Meet Tab Share */
    #stage {
      position: relative;
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #060709;
    }
    #slide-frame {
      position: relative;
      width: 100%;
      height: 100%;
      max-width: calc(100vh * (16 / 9));
      max-height: calc(100vw * (9 / 16));
      aspect-ratio: 16 / 9;
      box-shadow: 0 25px 80px rgba(0, 0, 0, 0.85);
      overflow: hidden;
      background: var(--bg-dark);
    }
    .slide-img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
      opacity: 0;
      transform: scale(1.012);
      transition: opacity 0.32s cubic-bezier(0.22, 1, 0.36, 1), transform 0.38s cubic-bezier(0.22, 1, 0.36, 1);
      pointer-events: none;
    }
    .slide-img.active {
      opacity: 1;
      transform: scale(1);
      pointer-events: auto;
    }

    /* Subtle Auto-Hiding Presenter HUD Bar at Bottom */
    #hud {
      position: fixed;
      bottom: 18px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 16px;
      background: rgba(14, 16, 22, 0.92);
      border: 1px solid rgba(232, 168, 56, 0.35);
      border-radius: 999px;
      backdrop-filter: blur(12px);
      z-index: 100;
      opacity: 0;
      transition: opacity 0.25s ease;
      box-shadow: 0 10px 30px rgba(0,0,0,0.6);
    }
    body:hover #hud, #hud.pinned {
      opacity: 1;
    }
    /* When in clean projection mode (P), hide HUD completely unless hovered right at bottom edge */
    body.clean-mode #hud {
      opacity: 0 !important;
      pointer-events: none;
    }

    .hud-btn {
      background: transparent;
      color: var(--offwhite);
      border: 1px solid rgba(255,255,255,0.14);
      padding: 6px 13px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.18s ease;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .hud-btn:hover {
      border-color: var(--amber);
      color: var(--amber);
      background: rgba(232, 168, 56, 0.08);
    }
    .hud-btn.primary {
      background: var(--amber);
      color: #0A0B0E;
      border-color: var(--amber);
    }
    .hud-btn.primary:hover {
      background: #f3b749;
    }
    #slide-counter {
      font-size: 13px;
      font-weight: 700;
      color: var(--amber);
      min-width: 72px;
      text-align: center;
      letter-spacing: 0.5px;
    }

    /* Top Progress Line */
    #progress-bar {
      position: fixed;
      top: 0;
      left: 0;
      height: 3px;
      background: linear-gradient(90deg, var(--copper), var(--amber));
      width: 4.76%;
      z-index: 120;
      transition: width 0.28s ease;
    }

    /* Slide Grid Modal (Press G) */
    #grid-modal {
      position: fixed;
      inset: 0;
      background: rgba(8, 9, 12, 0.96);
      backdrop-filter: blur(14px);
      z-index: 200;
      display: none;
      flex-direction: column;
      padding: 32px 48px;
      overflow-y: auto;
    }
    #grid-modal.open {
      display: flex;
    }
    .grid-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
      padding-bottom: 14px;
      border-bottom: 1px solid var(--line-dark);
    }
    .grid-header h2 {
      font-size: 20px;
      color: var(--amber);
      letter-spacing: 0.5px;
    }
    .grid-container {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(290px, 1fr));
      gap: 20px;
    }
    .grid-card {
      background: var(--card-dark);
      border: 2px solid var(--line-dark);
      border-radius: 10px;
      overflow: hidden;
      cursor: pointer;
      transition: transform 0.18s ease, border-color 0.18s ease;
    }
    .grid-card:hover, .grid-card.current {
      transform: translateY(-3px);
      border-color: var(--amber);
    }
    .grid-card img {
      width: 100%;
      aspect-ratio: 16 / 9;
      object-fit: cover;
      display: block;
    }
    .grid-card-label {
      padding: 10px 12px;
      font-size: 13px;
      font-weight: 600;
      color: var(--offwhite);
      display: flex;
      justify-content: space-between;
    }
    .grid-card-label span {
      color: var(--amber);
    }

    /* Click zones on left/right edges for easy mouse navigation */
    .nav-zone {
      position: fixed;
      top: 0;
      bottom: 80px;
      width: 12vw;
      z-index: 50;
      cursor: pointer;
    }
    #zone-prev { left: 0; }
    #zone-next { right: 0; }
  </style>
</head>
<body>

  <div id="progress-bar"></div>

  <div id="stage">
    <div id="slide-frame"></div>
  </div>

  <div id="zone-prev" class="nav-zone" title="Slide Anterior (←)"></div>
  <div id="zone-next" class="nav-zone" title="Próximo Slide (→)"></div>

  <!-- Presenter Controls Bar -->
  <div id="hud">
    <button class="hud-btn" id="btn-prev" title="Seta Esquerda (←)">◀ Anterior</button>
    <div id="slide-counter">01 / 21</div>
    <button class="hud-btn" id="btn-next" title="Seta Direita ou Espaço (→)">Próximo ▶</button>
    <button class="hud-btn" id="btn-grid" title="Tecla G">☷ Ver Todos (21)</button>
    <button class="hud-btn primary" id="btn-teleprompter" title="Abre janela separada com o Script Falado sincronizado (Tecla T)">🎙️ Abrir Teleprompter</button>
    <button class="hud-btn" id="btn-fullscreen" title="Tela Cheia (Tecla F)">⛶ Tela Cheia</button>
  </div>

  <!-- Grid Modal -->
  <div id="grid-modal">
    <div class="grid-header">
      <h2>PAINEL DE NAVEGAÇÃO RÁPIDA — 21 LÂMINAS (CLIQUE PARA IR DIRETO)</h2>
      <button class="hud-btn" id="btn-close-grid">✕ Fechar (ESC)</button>
    </div>
    <div class="grid-container" id="grid-items"></div>
  </div>

  <script>
    const SLIDES = [{"num": 1, "title": "Capa: Hackeando a Realidade", "script": "Sejam muito bem-vindos, pessoal. Boa noite pra todo mundo que já tá chegando aqui na sala. Antes de eu entrar no que eu preparei pra hoje, eu quero sentir quem tá aqui comigo ao vivo neste domingo, dia 15 de novembro. Então já manda aqui no chat pra mim de qual cidade você tá me assistindo agora e me responde com sinceridade uma coisa: você também sentiu nas últimas semanas que o tempo parece que acelerou e que ficou pesado demais tentar decidir e carregar tudo sozinho? Escreve aqui no chat se você sentiu isso na pele, porque nada do que você tá sentindo nessas últimas semanas é coisa da sua cabeça.\n\nEu preparei esse encontro de hoje com muito cuidado, e já quero alinhar o nosso combinado logo nesse primeiro minuto. Se você abriu essa transmissão achando que ia ver uma aula teórica chata pra ficar decorando nome de planeta, ou mais uma daquelas lives superficiais de internet, você vai se surpreender muito nos próximos minutos. Hoje nós vamos olhar pra Astrologia pela lente original dela: uma tecnologia milenar de leitura da realidade e do tempo. E o meu compromisso com você hoje é muito direto. Eu quero que você saia deste encontro enxergando exatamente que fase o planeta está atravessando agora, como o seu próprio ciclo se encaixa dentro disso tudo para destravar sua prosperidade, suas decisões e seus relacionamentos antes de 2027, e por que o céu de hoje à noite, especificamente entre as 18h e as 19h30 deste dia 15 de novembro, guarda uma das configurações mais raras do ano para quem decidiu despertar.", "img": "assets/slides/slide_01.jpg"}, {"num": 2, "title": "De Onde Nasce o Medo? (As 4 Estações)", "script": "Então respira fundo, desliga as distrações do celular e presta muita atenção nessa primeira verdade que eu coloquei na tela. Olha ao seu redor ou abre qualquer rede social hoje. A internet inteira parece que entrou em estado de pânico constante. É notícia de guerra, é polarização extrema, é a Inteligência Artificial mudando profissões inteiras da noite pro dia, é crise econômica, é gente boa acordando às três da manhã com o peito apertado sem saber pra onde o mundo tá indo.\n\nMas para e pensa comigo por um segundo: por que o ser humano sente medo diante disso tudo? O medo só existe quando você caminha no escuro e acha que o mundo está virando de cabeça para baixo por acidente. Imagina uma pessoa que nasceu numa ilha tropical e nunca ouviu falar que existem quatro estações no ano. Um dia ela viaja pro norte, chega o outono, as folhas das árvores começam a secar e cair no chão, o vento gela, a neve cobre a terra inteira e nada mais nasce no campo. O que acontece na cabeça de quem não conhece o ciclo das estações? Essa pessoa entra em desespero. Ela acha que a natureza morreu, que o planeta acabou, e paralisa de pavor.\n\nAgora, olha pro agricultor experiente que mora do lado dela. Ele olha pra mesma neve caindo lá fora e toma o café dele em paz. Ele não tem medo do inverno porque ele conhece o relógio das estações. Ele sabe exatamente quando o frio começa, sabe o que precisa guardar no celeiro, sabe que debaixo daquela terra gelada a próxima safra já está sendo preparada e sabe a semana exata em que a primavera vai voltar. Quando você entende astrologicamente o ciclo que o planeta está vivendo e compreende o seu próprio ciclo perante tudo isso, o medo simplesmente deixa de existir. No lugar da angústia, entra direção.", "img": "assets/slides/slide_02.jpg"}, {"num": 3, "title": "A Troca de Sistema Operacional (Plutão em Aquário)", "script": "E o que o relógio do céu está mostrando agora para o nosso planeta? Nós estamos vivendo uma coisa que a humanidade só assiste a cada muitos séculos: a mudança simultânea dos grandes planetas lentos, que são os ponteiros que regem civilizações inteiras. O primeiro grande movimento que está na tela é a saída definitiva de Plutão do signo de Capricórnio para o signo de Aquário.\n\nOlha o que isso significa na prática: durante os últimos anos, enquanto Plutão esteve em Capricórnio, todo o poder do mundo estava concentrado nas grandes estruturas verticais, nos bancos tradicionais, nos governos engessados, nas carreiras lineares onde você fazia trinta anos a mesma coisa e tinha uma falsa sensação de estabilidade. Quem ainda tenta se agarrar a esse modelo antigo hoje sente que o chão está rachando debaixo dos pés. Porque quando Plutão pisa em Aquário, o planeta inteiro troca de sistema operacional. O poder sai do topo daquelas velhas pirâmides lentas e migra para a tecnologia, para a Inteligência Artificial, para o conhecimento descentralizado e para a força dos grupos lúcidos. É exatamente por isso que, em questão de meses, a Inteligência Artificial virou o mercado de trabalho de cabeça para baixo.", "img": "assets/slides/slide_03.jpg"}, {"num": 4, "title": "Por Que Tudo Acelerou Tanto? (Urano + Saturno/Netuno)", "script": "E repara que Plutão em Aquário não está agindo sozinho. Ao mesmo tempo, nós temos outros dois movimentos colossais acontecendo entre 2026 e 2027: Urano avançando por Gêmeos, e Saturno junto com Netuno caminhando em Áries.\n\nUrano é o raio que revoluciona tudo o que toca, e Gêmeos rege a mente, a informação, o comércio e as conexões. Juntar Urano em Gêmeos com Plutão em Aquário significa que transformações que no século passado demoravam trinta anos para acontecer agora acontecem em trinta semanas. Enquanto isso, Saturno e Netuno em Áries explicam o choque de fronteiras lá fora: as tensões geopolíticas, as guerras de narrativa, a polarização extrema nas redes sociais e o desmoronamento de todas as ilusões e falsas seguranças.\n\nAgora presta atenção no terceiro cartão desta tela: quem olha para esse cenário sem a lente da Astrologia paralisa pelo medo. A pessoa trava o próprio dinheiro no banco perdendo poder de compra, aceita continuar num trabalho que drena a alma dela por pavor do amanhã e leva toda essa tensão para dentro do casamento. Já quem compreende o ciclo enxerga o que a história humana já provou dezenas de vezes: toda grande transição de era é o maior momento de transferência de prosperidade para quem tem clareza para se posicionar antes da multidão. Coloca aqui no chat se essa visão já muda a forma como você olha para o momento atual.", "img": "assets/slides/slide_04.jpg"}, {"num": 5, "title": "Da Universidade à 'Piadinha' de 1930", "script": "Diante disso, surge uma pergunta inevitável: se a Astrologia é essa tecnologia tão precisa para ler o tempo do mundo e o nosso próprio tempo, por que a maioria das pessoas inteligentes hoje tenta atravessar a vida às cegas? Pouca gente conhece os fatos históricos que eu coloquei nessa lâmina.\n\nAté o século dezessete, nas maiores e mais respeitadas universidades da Europa — como Bolonha, Pádua e Salamanca — a Astrologia era ensinada como ciência de elite ao lado da Medicina, da Astronomia e da Matemática. Um médico formado naquelas universidades era proibido de realizar uma cirurgia importante sem antes calcular o Mapa e os trânsitos do paciente, porque eles sabiam que intervir no corpo humano no ciclo errado colocava a vida da pessoa em risco. Em 1592, na Universidade de Pádua, o próprio Galileu Galilei dava aulas ensinando médicos, nobres e estrategistas a calcular mapas astrológicos antes de qualquer decisão crítica.\n\nMas pensa comigo: se você quer afastar pessoas capazes e inteligentes de uma ferramenta que dá autonomia sobre a própria vida, você não precisa queimar bibliotecas nem proibir nada por decreto. Basta transformar aquilo em motivo de chacota. Em 1930, jornais ingleses pegaram uma engenharia milenar que cruza dezenas de variáveis astronômicas exatas do seu nascimento e encolheram tudo em doze frases genéricas de rodapé de jornal — que hoje viraram meme de rede social sobre signo. O efeito foi cirúrgico: pessoas sérias, médicos, empresários, terapeutas, profissionais brilhantes passaram a ter vergonha de olhar para a própria bússola.", "img": "assets/slides/slide_05.jpg"}, {"num": 6, "title": "O Significado de 'Des-Astre'", "script": "E qual é a conta que você paga na sua rotina quando abre mão dessa bússola? Olha para a palavra que está destacada na tela: Desastre. Quando um projeto que você deu a vida morre na praia, quando uma sociedade quebra ou um relacionamento desmorona, a gente costuma chamar aquilo de desastre, achando que foi azar ou que faltou se esforçar mais. Só que repara no que a própria língua portuguesa está dizendo na nossa cara: o prefixo \"Des\" indica corte, desconexão — igual em desorientar ou desalinhar. E \"Astre\" vem literalmente de astro, as estrelas, o relógio do céu. Na origem da palavra, desastre significa agir desalinhado do céu.\n\nAntigamente, quem cruzava os oceanos se guiava pelas estrelas. Quando o tempo fechava e o navegador perdia os astros de vista, se ele teimasse em acelerar o barco no escuro, ele batia direto nas pedras. É exatamente isso que acontece quando você tenta decidir sua carreira, seus investimentos e suas conversas definitivas olhando apenas para o calendário gregoriano de papel na parede, achando que toda segunda-feira é igual.\n\nOlha pro quadro da direita: a cultura moderna te vendeu a mentira biológica de que basta trabalhar quatorze horas por dia e fazer força bruta que tudo dá certo. Experimenta pegar a semente mais cara e fértil do mundo e jogar na terra no meio de uma geada de inverno. Não importa o quanto você regue, trabalhe ou reze: a planta morre porque a estação estava errada. Força de vontade no ciclo errado só serve para acelerar o seu esgotamento. Quem aqui já viveu na pele a sensação de estar dando o sangue mas remando contra a maré? Digita EU JÁ aqui no chat.", "img": "assets/slides/slide_06.jpg"}, {"num": 7, "title": "A Virada dos Nodos Lunares (Leão → Aquário)", "script": "E agora olha para um dos movimentos mais profundos do céu atual, que mostra por que tentar resolver a vida sozinho ficou insuportável neste fim de ano: a virada do eixo dos Nodos Lunares. Na Astrologia, o Nodo Sul aponta o comportamento antigo que está sendo encerrado, e o Nodo Norte mostra exatamente para onde a linha do tempo da evolução está puxando a humanidade.\n\nNeste momento, o eixo está virando de Leão para Aquário. O Nodo Sul em Leão está desligando a tomada daquele modelo antigo do lobo solitário: a pessoa centrada no próprio orgulho, que acha que precisa carregar o mundo nas costas sozinha, trancada no quarto escuro, mantendo a pose de que está tudo bem enquanto por dentro está esgotada.\n\nE para onde o Nodo Norte em Aquário está empurrando a prosperidade, a proteção e o crescimento real pelos próximos anos? Para a força do coletivo. Para as alianças horizontais, para a inteligência compartilhada e para o pertencimento a um clã consciente. Se você tentar atravessar 2027 isolado, cercado apenas de conversas rasas no trabalho ou na família, você vai estar nadando contra a própria correnteza astronômica do planeta. Caminhar junto com uma tribo lúcida que fala a mesma língua deixou de ser um luxo — é a própria direção do relógio do céu.", "img": "assets/slides/slide_07.jpg"}, {"num": 8, "title": "A Cirurgia do Sol em Escorpião", "script": "E junto com esse chamado coletivo de Aquário, repara em qual signo o Sol está brilhando exatamente hoje, neste dia 15 de novembro: Escorpião. Esquece os clichês rasos de internet sobre Escorpião. Na Astrologia séria, Escorpião é o cirurgião do zodíaco. É a lente da verdade nua, que olha embaixo do tapete para cortar o que já apodreceu e liberar a verdadeira regeneração.\n\nOlha para os três cartões na tela. Primeiro: o mundo lá fora tenta te empurrar para dois extremos doentes — de um lado, o pânico paralisante; do outro, aquela positividade tóxica infantil de achar que basta repetir frases bonitas na frente do espelho e \"vibrar alto\" que os boletos se pagam sozinhos. O Sol em Escorpião corta essas duas mentiras e exige maturidade adulta. Segundo: na sua prosperidade e na sua Casa Oito, ele mostra exatamente o ponto cego onde você está vazando energia vital e dinheiro por medo de encerrar acordos, hábitos ou ciclos profissionais que já morreram. E terceiro: nos seus relacionamentos, ele mostra por que tanta gente inteligente repete sempre o mesmo padrão afetivo desgastante. Quando você enxerga como funcionam a sua Lua, a sua Vênus, a sua Lilith e a sua Casa Sete, você para de culpar o azar ou o \"dedo podre\" e assume o comando das suas escolhas.", "img": "assets/slides/slide_08.jpg"}, {"num": 9, "title": "De Chinelo e Camiseta na Sala de Casa", "script": "E talvez você esteja se perguntando agora: \"Crassus, mas será que eu consigo aplicar uma leitura profunda assim na minha rotina sem precisar estudar cinco anos em livros difíceis?\". Deixa eu te contar rapidamente como essa chave virou na minha própria vida.\n\nAntes de dedicar a minha vida à Astrologia, eu era empresário do mundo tradicional. Eu tinha negócios, andava de terno e gravata, ganhava dinheiro, mas sentia todos os dias um vazio silencioso, como se eu estivesse gastando a minha vida fora do meu próprio eixo. Eu já estudava Astrologia a fundo, até que num sábado de manhã, antes de tomar qualquer decisão drástica de vender minhas empresas, eu resolvi fazer um teste real. Eu limpei a mesa da sala da minha casa, coloquei duas cadeiras simples, dobrei o terno no armário e sentei ali de chinelo e camiseta para receber e atender a minha primeira cliente lendo o Mapa dela.\n\nNaquela manhã, sentado de chinelo e camiseta na sala de casa, caiu a maior ficha da minha vida: quando você tira todo aquele misticismo confuso e arrogante da frente e traduz o Mapa na língua da vida real — de um jeito tão claro, lógico e humano que até a Dona Neusa entende e aplica na segunda-feira — uma única leitura destrava em uma hora o que anos de tentativa e erro não conseguiram resolver. Em um ano, eu vendi todas as minhas empresas tradicionais porque descobri que nada no mundo tem o poder de transformação prática dessa ferramenta quando ela é ensinada do jeito certo.", "img": "assets/slides/slide_09.jpg"}, {"num": 10, "title": "As 3 Engrenagens da Vida Real", "script": "E olha na tela como essa tradução funciona na prática através das três engrenagens vivas do seu Mapa e do seu tempo.\n\nA primeira engrenagem são os Planetas, que respondem à pergunta \"O Quê?\" — quais são os personagens que operam no seu centro de comando interno: o Sol é a sua essência e direção central; a Lua mostra do que você precisa para se sentir seguro emocionalmente; Mercúrio é a forma como você pensa, fala e negocia; Vênus mostra o que te atrai no amor e como você lida com o dinheiro e o valor; Marte é a sua coragem de execução e corte; Júpiter mostra onde a sua vida expande com facilidade; e Saturno aponta onde a vida exige responsabilidade e estrutura sólida.\n\nA segunda engrenagem são os Signos, que respondem \"Como?\" cada um desses planetas se expressa em você, revelando seus talentos naturais e como parar de brigar contra a sua própria estrutura.\n\nE a terceira engrenagem são as Casas Astrológicas cruzadas com os Trânsitos do céu, que respondem \"Onde e Quando?\" o relógio das suas decisões está batendo hoje. Quando Saturno pressiona a sua Casa Dois, a meteorologia do céu é clara: enxugar custos, proteger o caixa e ter paciência, porque quem tenta expandir no grito nessa hora quebra. Quando Urano ativa a sua rota, o ciclo exige coragem para cortar o que estagnou. E quando Júpiter abre o caminho na sua carreira ou nas suas finanças, é hora de avançar com força total. Me conta aqui no chat agora: qual área da sua vida hoje mais precisa dessa clareza de timing — PROSPERIDADE, CARREIRA ou RELACIONAMENTOS?", "img": "assets/slides/slide_10.jpg"}, {"num": 11, "title": "Nada Nesta Data Foi Escolhido Por Acaso", "script": "Tô vendo vocês responderem aqui no chat: Prosperidade, Carreira, Relacionamentos, as três áreas juntas... E agora eu quero revelar para vocês um bastidor deste encontro que arrepia qualquer pessoa que compreende o poder real da Astrologia.\n\nOlha pro relógio agora. Nós estamos entrando exatamente na janela das 19h30 deste domingo, dia 15 de novembro. Vocês acham mesmo que eu marquei este encontro para o dia 15 de novembro e escolhi abrir a nossa comunidade exatamente neste horário só porque domingo à noite é um dia tranquilo na agenda?\n\nDe jeito nenhum. Lembra que eu mostrei agora há pouco que os antigos estrategistas, médicos e sábios nunca iniciavam uma grande obra ou fundavam um movimento sem antes abrir o mapa do céu para escolher o minuto exato do nascimento daquela criação? No início deste mês, eu sentei em call com o nosso time, abri o mapa de novembro inteiro na tela e procurei qual era a janela mais rara e potente do ano para fazer nascer oficialmente o projeto mais importante da minha vida. E quando eu coloquei na tela o dia 15 de novembro, exatamente nesta janela entre as 18h e as 19h30, eu falei na hora: \"Cara, esse é o mapa do negócio. Não dá para ignorar isso aqui. Tem que nascer exatamente neste minuto\".", "img": "assets/slides/slide_11.jpg"}, {"num": 12, "title": "A Egrégora do Despertar (15/11 às 19h30)", "script": "Olha para o desenho do mapa que está na sua tela agora, porque esse é literalmente o céu que está aberto sobre as nossas cabeças neste exato minuto, às 19h30 do dia 15 de novembro.\n\nPrimeiro: nós temos o Ascendente em Gêmeos com o planeta Urano cravado em cima do Ascendente. Urano é o despertador da consciência, é o ativista, é a visão elétrica que enxerga anos na frente.\n\nSegundo: esse Urano no Ascendente está fazendo um trígono exato de ar com a Lua em conjunção com Plutão no signo de Aquário, lá na Casa Nove. Quando eu bati o olho nessa configuração de Lua com Plutão em Aquário recebendo o trígono de Urano, eu vi na hora qual é o cimento que vai unir as pessoas que estão entrando hoje: é o pertencimento visceral ao grupo. É a proteção do clã. É uma coletividade de despertar, onde pessoas quentes, inteligentes e despertas defendem ideias reais e caminham juntas.\n\nE terceiro: nós temos as Casas Três e Nove totalmente ativadas, com o Sol em Escorpião na Casa Seis e o Meio do Céu em Peixes. A Casa Nove traz as grandes respostas e o sentido que eliminam o medo. A Casa Três com Ascendente em Gêmeos garante que dentro dessa comunidade ninguém vai passar despercebido: todo mundo troca, interage, debate interpretações e cresce junto. E o Meio do Céu em Peixes consagra esse movimento a um propósito espiritual e humano muito maior do que o nosso próprio umbigo.", "img": "assets/slides/slide_12.jpg"}, {"num": 13, "title": "Comunidade Astrowake: Portas Abertas", "script": "É debaixo deste mapa exato da Egrégora do Despertar que eu declaro oficialmente nascida e de portas abertas a Comunidade Astrowake.\n\nE deixa eu te falar uma coisa olho no olho, que está escrita nessa lâmina e que provavelmente você já sente na pele há muito tempo, mas quase ninguém tem coragem de admitir em voz alta: começar a enxergar a vida com mais profundidade dá uma sensação absurda de solidão quando você está no ambiente errado.\n\nQuando você sai do piloto automático e começa a compreender os ciclos e o porquê das coisas, parece que você vira um estranho no próprio ninho. As conversas nas rodas de amigos antigos ficam rasas demais. O ambiente de trabalho tradicional parece um teatro onde todo mundo finge o tempo inteiro. E até dentro da própria família, muitas vezes fica difícil explicar o que você está enxergando e construindo sem ser julgado ou incompreendido.", "img": "assets/slides/slide_13.jpg"}, {"num": 14, "title": "A Regra da Evolução & O Seu Lugar", "script": "E aqui existe uma regra lógica da natureza humana que ninguém consegue burlar: ninguém consegue sustentar a própria evolução caminhando sozinho no meio de pessoas que só puxam você de volta para o automático. Mais cedo ou mais tarde, o cansaço bate, a dúvida entra e o barulho do mundo te engole.\n\nFoi exatamente por isso que eu decidi erguer a Comunidade Astrowake. Para ser o seu lugar seguro pelos próximos doze meses. Um ambiente vivo onde você nunca mais precisa se diminuir para caber na mesa. Onde você finalmente encontra a sua turma: gente lúcida, inteligente, desperta e com os pés no chão, que olha para a vida, para os negócios, para a espiritualidade e para as relações na mesma frequência que você.", "img": "assets/slides/slide_14.jpg"}, {"num": 15, "title": "O Fim do 'Modo Difícil'", "script": "Porque o que une as pessoas dentro da nossa Comunidade vai muito além de afinidade: é um mecanismo prático de leitura da realidade que decreta o fim do Modo Difícil na sua vida.\n\nOlha pro quadro da esquerda na tela: a maioria das pessoas lá fora joga a vida inteira no Modo Difícil. Elas tomam decisões de carreira e dinheiro no escuro, na base da tentativa e erro; entram e saem de relacionamentos repetindo exatamente o mesmo padrão de desgaste; e brigam contra o próprio tempo, tentando acelerar quando a vida pede cautela e travando de medo quando a janela de oportunidade está escancarada. Tudo isso porque não entendem como a própria estrutura funciona.\n\nAgora olha pro quadro claro da direita: aqui dentro da Comunidade Astrowake, nós usamos a Astrologia de forma séria e prática — baseada em cinco mil anos de observação do comportamento humano e dos ciclos do tempo, sem qualquer decoreba chata ou misticismo de palco. Você passa a enxergar a lógica real por trás das pessoas, das suas emoções, dos negócios e do tempo.", "img": "assets/slides/slide_15.jpg"}, {"num": 16, "title": "Por Que Uma Comunidade Ativa? (Os 3 Motores)", "script": "E por que eu construí uma Comunidade Ativa de doze meses em vez de simplesmente vender um curso gravado? Porque eu percebi que a última coisa que você precisa hoje é comprar mais um curso para ficar assistindo sozinho num quarto escuro, acumulando aula na gaveta. Para você realmente transformar a sua rota em 2027, você precisa desses três motores que estão na tela funcionando juntos durante os próximos doze meses:\n\nO Motor Um é o Pertencimento Real: estar cercado diariamente de empresários, terapeutas, médicos, psicólogos, astrólogos e pessoas despertas que falam a mesma língua, trocam experiências reais, fecham parcerias e se apoiam nas viradas de fase.\n\nO Motor Dois é a Velocidade de Decisão no Dia a Dia: ter o nosso Aplicativo da Bússola na palma da sua mão, cruzando o seu Mapa Natal com os trânsitos do dia em trinta segundos, sem você precisar decorar absolutamente nada.\n\nE o Motor Três é o Direcionamento Olho no Olho Comigo: sentar comigo a cada quinze dias ao vivo para abrirmos mapas, analisarmos a vida real — carreira, dinheiro, relações e decisões — e ajustarmos a rota juntos.", "img": "assets/slides/slide_16.jpg"}, {"num": 17, "title": "Durante 12 Meses Teremos... (Pilares 01 a 03)", "script": "Agora olha na tela, com calma, a grandeza dos seis entregáveis que você destrava imediatamente no seu passaporte de um ano inteiro ao entrar na Comunidade Astrowake. Nesta primeira lâmina estão os três primeiros:\n\nEntregável Zero Um: A Comunidade Ativa e os vinte e quatro Encontros Quinzenais Ao Vivo comigo no ano. Esse é o coração vivo do nosso movimento. A cada quinze dias nós nos reunimos ao vivo para abrir juntos mapas reais dos membros na tela, analisar casos práticos e debater a decodificação da realidade usando a Astrologia — destravando questões reais de negócios, transição de carreira, dinheiro e relacionamentos. Além disso, você entra no nosso grupo fechado no WhatsApp para trocar experiências diárias com o clã e decidir junto comigo os temas dos nossos próximos encontros e convidados especiais.\n\nEntregável Zero Dois: O Aplicativo da Bússola mais Inteligência Diária no seu celular. Você não precisa esperar meses de estudo para aplicar a Astrologia na sua rotina. Já no seu primeiro dia, você abre o Aplicativo da Bússola enquanto toma o seu café da manhã e, em trinta segundos, ele cruza automaticamente o seu Mapa Natal com os trânsitos daquele dia. Ele mostra na tela do celular qual área da sua vida está ativada hoje, até que horas dura aquela pressão ou abertura, e traz uma Inteligência treinada diretamente no meu método para você consultar qualquer decisão prática — como \"devo fechar esse contrato esta semana?\" ou \"como conduzir essa conversa difícil hoje?\".\n\nEntregável Zero Três: A Formação Completa em Astrologia, o Astrowake. Para você que quer ter autonomia total de leitura, você recebe acesso imediato a toda a minha formação principal, onde você domina a estrutura profunda de Planetas, Signos, Casas e Aspectos em aulas diretas ao ponto, sem precisar decorar listas ou tabelas. Serve tanto para você governar as decisões da sua própria vida quanto para você atuar e atender outras pessoas profissionalmente.", "img": "assets/slides/slide_17.jpg"}, {"num": 18, "title": "Durante 12 Meses Teremos... (Pilares 04 a 06)", "script": "E olha nesta próxima lâmina os outros três entregáveis gigantes que completam o seu passaporte anual:\n\nEntregável Zero Quatro: A Formação em Trânsitos, o Astrowake Trânsitos. Aqui você domina a engenharia completa do tempo e das previsões. Você aprende a enxergar com meses de antecedência quando uma área da sua vida financeira, profissional ou afetiva vai entrar em uma virada importante — sabendo exatamente quando acelerar, quando cortar custos e como aproveitar no topo cada janela de oportunidade antes de 2027.\n\nEntregável Zero Cinco: O nosso Acervo de Estudos de Caso com mais de quarenta Masterclasses gravadas — a nossa verdadeira Netflix de casos reais. São mais de quarenta aulas profundas onde nós abrimos o Mapa e dissecamos a mente e a trajetória de grandes personalidades, como Ayrton Senna e Elon Musk, além de clínicas completas sobre o comportamento humano que mudam a sua visão de mundo, como A Síndrome do Bonzinho, Os Três Amores e como destravar a agressividade saudável e o poder de execução.\n\nE o Entregável Zero Seis: O Manual Visual de Consulta Rápida. Um guia visual e tático para você ter sempre aberto no computador ou no celular quando quiser checar rapidamente um posicionamento no Mapa ou estruturar uma leitura completa em poucos minutos, sem nunca dar branco ou ficar no escuro.", "img": "assets/slides/slide_18.jpg"}, {"num": 19, "title": "A Nossa Mesa: Quem Está Sentado Com Você?", "script": "E quem são as pessoas que estão atravessando essa porta hoje para sentar nessa mesa com você pelos próximos doze meses? Olha os quatro perfis na tela:\n\nPrimeiro: Pessoas em transição de fase, que cansaram de bater cabeça no modo difícil e decidiram construir 2027 com clareza, prosperidade e paz mental.\n\nSegundo: Empresários, líderes e profissionais liberais, que usam a leitura de perfil e de ciclos para contratar melhor, entender sócios, negociar contratos e acertar o timing financeiro dos negócios.\n\nTerceiro: Terapeutas, psicólogos, médicos e mentores, que querem uma lente cirúrgica para enxergar a raiz do problema do seu cliente ou paciente em quinze minutos de conversa, onde métodos comuns levariam seis meses de tentativa.\n\nE quarto: Astrólogos e profissionais da nova geração, do nosso movimento Astrolegacy, que decidiram dominar essa ferramenta milenar em alto nível para orientar vidas com seriedade e caminhar cercados por uma egrégora forte.", "img": "assets/slides/slide_19.jpg"}, {"num": 20, "title": "O Convite de Embaixador & Ancoragem de Valor", "script": "Por estar aqui comigo hoje, no dia 15 de novembro, vendo essa egrégora nascer ao vivo sob o mapa das 19h30, você está recebendo o Convite de Membro Embaixador da Comunidade Astrowake.\n\nOs Embaixadores são os membros fundadores que entram na inauguração deste modelo, caminham mais perto de mim durante os próximos doze meses, têm voz ativa na construção dos nossos encontros quinzenais e garantem uma condição financeira única de Black Friday que não existirá para quem vier depois.\n\nOlha o quadro à direita na tela com o valor real de cada peça se você fosse adquirir separadamente: a Formação Completa Astrowake mais a Formação em Trânsitos custam R$ 1.997. Os 24 Encontros Quinzenais Ao Vivo comigo ao longo de um ano custam mais R$ 1.997. O acesso anual ao Aplicativo da Bússola com Inteligência Artificial custa R$ 997. O Acervo com mais de 40 Masterclasses custa R$ 297, e o Manual Visual de Consulta Rápida custa R$ 197. Somando tudo, o valor real deste ecossistema é de R$ 5.485,00 por ano. E perto do quanto custa tomar uma única decisão financeira errada ou passar mais um ano remando contra a maré, cinco mil reais já seria um investimento irrisório.", "img": "assets/slides/slide_20.jpg"}, {"num": 21, "title": "Portas Abertas: Condição Única de Black Friday (12x R$ 149,70)", "script": "Mas hoje é o nascimento oficial da nossa Comunidade, e eu quero honrar cada pessoa lúcida que atendeu a esse chamado neste domingo. Por isso, entrando agora na nossa condição única de Black Friday como Membro Embaixador, você não vai investir cinco mil e quatrocentos reais, nem metade disso.\n\nVocê garante o seu passaporte completo para os 12 meses da Comunidade Astrowake — com os 24 Encontros Quinzenais Ao Vivo comigo, o Aplicativo da Bússola no celular o ano inteiro, a Formação Completa Astrowake, a Formação em Trânsitos, as 40 Masterclasses e o Manual Visual — por apenas 12 parcelas de R$ 149,70, ou R$ 1.497,00 à vista.\n\nPara para pensar nisso: dá menos de cinco reais por dia. Menos do que um café na padaria para você nunca mais decidir sua vida no escuro e nunca mais caminhar sozinho. E você ainda entra protegido pela nossa Garantia Incondicional de 7 dias: você clica no link agora, entra na plataforma, já baixa e testa o Aplicativo da Bússola com o seu Mapa, assiste às aulas e sente a energia do nosso grupo. Se em até sete dias você achar que não foi a melhor decisão do seu ano, basta um clique e devolvemos 100% do seu investimento.\n\nE um recado importante: se você quer muito garantir a sua cadeira de Embaixador hoje na condição de Black Friday, mas está com o limite do cartão apertado e precisa dar uma entrada menor agora para parcelar o restante, chama imediatamente a minha equipe no link de suporte do WhatsApp que está lá no grupo, porque o nosso time comercial está de plantão agora à noite para viabilizar a sua entrada.\n\nO link oficial já está liberado aqui no chat e também lá no nosso Grupo de WhatsApp. Quem já estiver garantindo a vaga agora, escreve aqui no chat \"TÔ NA NAVE\" ou \"SOU EMBAIXADOR\" que eu quero dar as boas-vindas pelo nome para cada um de vocês! O mapa das 19h30 já está rodando no céu. A oportunidade tá na mesa. Bora pra nave!", "img": "assets/slides/slide_21.jpg"}];

    const gridModal = document.getElementById('grid-modal');
    const gridItems = document.getElementById('grid-items');

    // Render all slide images into DOM for instant zero-lag transitions
    SLIDES.forEach((s, idx) => {
      const img = document.createElement('img');
      img.src = s.img;
      img.alt = s.title;
      img.className = 'slide-img' + (idx === 0 ? ' active' : '');
      img.id = 'slide-el-' + idx;
      frame.appendChild(img);

      // Build grid card
      const card = document.createElement('div');
      card.className = 'grid-card' + (idx === 0 ? ' current' : '');
      card.id = 'grid-card-' + idx;
      card.innerHTML = `
        <img src="${s.img}" alt="${s.title}" loading="lazy" />
        <div class="grid-card-label">
          <div>${s.title}</div>
          <span>${String(s.num).padStart(2, '0')}/21</span>
        </div>
      `;
      card.addEventListener('click', () => {
        goToSlide(idx);
        gridModal.classList.remove('open');
      });
      gridItems.appendChild(card);
    });

    function goToSlide(index) {
      if (index < 0 || index >= SLIDES.length) return;
      document.getElementById('slide-el-' + currentIndex).classList.remove('active');
      document.getElementById('grid-card-' + currentIndex).classList.remove('current');
      currentIndex = index;
      document.getElementById('slide-el-' + currentIndex).classList.add('active');
      document.getElementById('grid-card-' + currentIndex).classList.add('current');

      const numStr = String(currentIndex + 1).padStart(2, '0');
      counter.textContent = `${numStr} / ${SLIDES.length}`;
      progressBar.style.width = `${((currentIndex + 1) / SLIDES.length) * 100}%`;

      syncTeleprompter();
    }

    function nextSlide() {
      if (currentIndex < SLIDES.length - 1) goToSlide(currentIndex + 1);
    }

    function prevSlide() {
      if (currentIndex > 0) goToSlide(currentIndex - 1);
    }

    document.getElementById('btn-next').addEventListener('click', nextSlide);
    document.getElementById('btn-prev').addEventListener('click', prevSlide);
    document.getElementById('zone-next').addEventListener('click', nextSlide);
    document.getElementById('zone-prev').addEventListener('click', prevSlide);

    document.getElementById('btn-grid').addEventListener('click', () => {
      gridModal.classList.toggle('open');
    });
    document.getElementById('btn-close-grid').addEventListener('click', () => {
      gridModal.classList.remove('open');
    });

    document.getElementById('btn-fullscreen').addEventListener('click', toggleFullscreen);

      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(() => {});

            </div>
            <div class="controls">
              <button onclick="window.opener.prevSlide()">◀ Slide Anterior</button>
              <button onclick="window.opener.nextSlide()">Próximo Slide ▶</button>
            </div>
          </div>
          <div class="script-box" id="tp-script"></div>
          <div class="preview-row">
            <img id="tp-img" src="" alt="Slide Atual" />
            <div>
              <div style="color:#E8A838;font-weight:700;margin-bottom:6px;">DICA PARA O GOOGLE MEET:</div>
              <div class="hint">No Google Meet, clique em <b>"Apresentar agora" → "Uma guia"</b> e selecione a guia principal dos slides.<br/>Esta janela do Teleprompter fica visível <b>apenas para você</b>! Você pode passar os slides tanto por aqui quanto pelas setas do teclado.</div>
            </div>
          </div>
        </body>
        </html>
      `);
      doc.close();
      syncTeleprompter();
    }

    function syncTeleprompter() {
      if (!teleprompterWin || teleprompterWin.closed) return;
      const s = SLIDES[currentIndex];
      const d = teleprompterWin.document;
      const numEl = d.getElementById('tp-num');
      if (numEl) {
        numEl.textContent = `SLIDE ${String(s.num).padStart(2, '0')} / 21`;
        d.getElementById('tp-title').textContent = s.title;
        d.getElementById('tp-script').textContent = s.script;
        d.getElementById('tp-img').src = s.img;
        teleprompterWin.scrollTo({ top: 0, behavior: 'smooth' });
      }
    }

    document.getElementById('btn-teleprompter').addEventListener('click', openTeleprompter);

    // Expose navigation functions to teleprompter popup
    window.nextSlide = nextSlide;
    window.prevSlide = prevSlide;

    // Keyboard shortcuts
    window.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowRight' || e.key === ' ' || e.key === 'PageDown') {
        e.preventDefault();
        nextSlide();
      } else if (e.key === 'ArrowLeft' || e.key === 'PageUp') {
        e.preventDefault();
        prevSlide();
      } else if (e.key === 'g' || e.key === 'G') {
        gridModal.classList.toggle('open');
      } else if (e.key === 'Escape') {
        gridModal.classList.remove('open');
      } else if (e.key === 'f' || e.key === 'F') {
        toggleFullscreen();
      } else if (e.key === 't' || e.key === 'T') {
        openTeleprompter();
      } else if (e.key === 'Home') {
        goToSlide(0);
      } else if (e.key === 'End') {
        goToSlide(SLIDES.length - 1);
      }
    });
  </script>
</body>
</html>
