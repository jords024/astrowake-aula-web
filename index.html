<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Astrowake — Hackeando a Realidade (Guia de Slides para Google Meet)</title>
  <style>
    :root {
      --bg-dark: #0A0B0E;
      --card-dark: #12141A;
      --offwhite: #F4F3EF;
      --amber: #E8A838;
      --copper: #C65C20;
      --line-dark: #2C303A;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }
    html, body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background-color: var(--bg-dark);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      color: var(--offwhite);
    }

    #stage {
      position: relative;
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #060709;
    }
    #slide-frame {
      position: relative;
      width: 100%;
      height: 100%;
      max-width: calc(100vh * (16 / 9));
      max-height: calc(100vw * (9 / 16));
      aspect-ratio: 16 / 9;
      box-shadow: 0 25px 80px rgba(0, 0, 0, 0.85);
      overflow: hidden;
      background: var(--bg-dark);
    }
    .slide-img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
      opacity: 0;
      transform: scale(1.01);
      transition: opacity 0.28s ease, transform 0.34s ease;
      pointer-events: none;
    }
    .slide-img.active {
      opacity: 1;
      transform: scale(1);
      pointer-events: auto;
    }

    /* Auto-hiding HUD bar */
    #hud {
      position: fixed;
      bottom: 18px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 9px 18px;
      background: rgba(14, 16, 22, 0.94);
      border: 1px solid rgba(232, 168, 56, 0.45);
      border-radius: 999px;
      backdrop-filter: blur(12px);
      z-index: 100;
      opacity: 0;
      transition: opacity 0.25s ease;
      box-shadow: 0 10px 30px rgba(0,0,0,0.7);
    }
    body.show-hud #hud, #hud:hover {
      opacity: 1;
    }

    .hud-btn {
      background: transparent;
      color: var(--offwhite);
      border: 1px solid rgba(255,255,255,0.16);
      padding: 7px 14px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.18s ease;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      text-decoration: none;
    }
    .hud-btn:hover {
      border-color: var(--amber);
      color: var(--amber);
      background: rgba(232, 168, 56, 0.08);
    }
    .hud-btn.primary {
      background: var(--amber);
      color: #0A0B0E;
      border-color: var(--amber);
      font-weight: 800;
    }
    .hud-btn.primary:hover {
      background: #f5ba4b;
      color: #0A0B0E;
    }
    #slide-counter {
      font-size: 13px;
      font-weight: 800;
      color: var(--amber);
      min-width: 72px;
      text-align: center;
    }

    #progress-bar {
      position: fixed;
      top: 0;
      left: 0;
      height: 3px;
      background: linear-gradient(90deg, var(--copper), var(--amber));
      width: 4.76%;
      z-index: 120;
      transition: width 0.28s ease;
    }

    /* Slide Grid Modal */
    #grid-modal {
      position: fixed;
      inset: 0;
      background: rgba(8, 9, 12, 0.96);
      backdrop-filter: blur(14px);
      z-index: 200;
      display: none;
      flex-direction: column;
      padding: 32px 48px;
      overflow-y: auto;
    }
    #grid-modal.open {
      display: flex;
    }
    .grid-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
      padding-bottom: 14px;
      border-bottom: 1px solid var(--line-dark);
    }
    .grid-header h2 {
      font-size: 20px;
      color: var(--amber);
    }
    .grid-container {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(290px, 1fr));
      gap: 20px;
    }
    .grid-card {
      background: var(--card-dark);
      border: 2px solid var(--line-dark);
      border-radius: 10px;
      overflow: hidden;
      cursor: pointer;
      transition: transform 0.18s ease, border-color 0.18s ease;
    }
    .grid-card:hover, .grid-card.current {
      transform: translateY(-3px);
      border-color: var(--amber);
    }
    .grid-card img {
      width: 100%;
      aspect-ratio: 16 / 9;
      object-fit: cover;
      display: block;
    }
    .grid-card-label {
      padding: 10px 12px;
      font-size: 13px;
      font-weight: 600;
      color: var(--offwhite);
      display: flex;
      justify-content: space-between;
    }
    .grid-card-label span {
      color: var(--amber);
    }

    .nav-zone {
      position: fixed;
      top: 0;
      bottom: 80px;
      width: 12vw;
      z-index: 50;
      cursor: pointer;
    }
    #zone-prev { left: 0; }
    #zone-next { right: 0; }
  </style>
</head>

 Séc. XVII • Galileu em Pádua (1592) • Jornais ingleses em 1930", "raw_script": "Só que aí surge uma pergunta óbvia: se a Astrologia é essa bússola tão precisa para ler o tempo do mundo e o nosso próprio tempo, **por que a maioria das pessoas inteligentes hoje tenta atravessar a vida no escuro?** Pouca gente conhece a história real por trás disso.\n\nAté o **século dezessete**, nas maiores universidades da Europa, como **Bolonha, Pádua e Salamanca**, a Astrologia era ensinada lado a lado com a **Medicina, a Astronomia e a Matemática**. Um médico formado naquelas universidades era proibido de realizar uma cirurgia importante sem antes calcular o Mapa e os trânsitos do paciente, porque eles sabiam que intervir no corpo humano no ciclo errado colocava a vida da pessoa em risco. Na **Universidade de Pádua, em mil quinhentos e noventa e dois**, o próprio ==Galileu Galilei dava aulas ensinando médicos e estrategistas a calcular mapas astrológicos==. Reis, navegadores e fundadores de impérios nunca abriam uma rota comercial ou iniciavam um movimento sem ler o céu.\n\nMas se você quer afastar pessoas capazes e inteligentes de uma ferramenta que dá autonomia sobre a própria vida, você não precisa queimar livros nem proibir nada. **Basta transformar aquilo em piadinha.** Em **mil novecentos e trinta**, jornais ingleses pegaram uma ciência milenar que cruza dezenas de variáveis matemáticas do seu nascimento e ==reduziram tudo a doze frases genéricas de rodapé de página==, que hoje viraram meme de internet sobre signo. O efeito foi cirúrgico. Pessoas sérias, médicos, empresários, terapeutas e profissionais brilhantes passaram a sentir vergonha de olhar para a única ferramenta capaz de mostrar o relógio dos próprios ciclos. E o resultado disso é que hoje a gente vê um exército de pessoas extremamente competentes jogando a vida no **Modo Difícil**.", "html_script": "<p>Só que aí surge uma pergunta óbvia: se a Astrologia é essa bússola tão precisa para ler o tempo do mundo e o nosso próprio tempo, <strong>por que a maioria das pessoas inteligentes hoje tenta atravessar a vida no escuro?<\/strong> Pouca gente conhece a história real por trás disso.<\/p>\n<p>Até o <strong>século dezessete<\/strong>, nas maiores universidades da Europa, como <strong>Bolonha, Pádua e Salamanca<\/strong>, a Astrologia era ensinada lado a lado com a <strong>Medicina, a Astronomia e a Matemática<\/strong>. Um médico formado naquelas universidades era proibido de realizar uma cirurgia importante sem antes calcular o Mapa e os trânsitos do paciente, porque eles sabiam que intervir no corpo humano no ciclo errado colocava a vida da pessoa em risco. Na <strong>Universidade de Pádua, em mil quinhentos e noventa e dois<\/strong>, o próprio <span class=\"hl-amber\">Galileu Galilei dava aulas ensinando médicos e estrategistas a calcular mapas astrológicos<\/span>. Reis, navegadores e fundadores de impérios nunca abriam uma rota comercial ou iniciavam um movimento sem ler o céu.<\/p>\n<p>Mas se você quer afastar pessoas capazes e inteligentes de uma ferramenta que dá autonomia sobre a própria vida, você não precisa queimar livros nem proibir nada. <strong>Basta transformar aquilo em piadinha.<\/strong> Em <strong>mil novecentos e trinta<\/strong>, jornais ingleses pegaram uma ciência milenar que cruza dezenas de variáveis matemáticas do seu nascimento e <span class=\"hl-amber\">reduziram tudo a doze frases genéricas de rodapé de página<\/span>, que hoje viraram meme de internet sobre signo. O efeito foi cirúrgico. Pessoas sérias, médicos, empresários, terapeutas e profissionais brilhantes passaram a sentir vergonha de olhar para a única ferramenta capaz de mostrar o relógio dos próprios ciclos. E o resultado disso é que hoje a gente vê um exército de pessoas extremamente competentes jogando a vida no <strong>Modo Difícil<\/strong>.<\/p>", "img": "assets/slides/slide_05.jpg"}, {"num": 6, "act": "ETIMOLOGIA E NAVEGAÇÃO DO TEMPO", "title": "O Significado de 'Des-Astre'", "cue" ua segunda-feira, de um jeito simples, sem precisar passar cinco anos decorando enciclopédia? Deixa eu te contar como essa chave virou na minha própria história.<\/p>\n<p>Antes de dedicar a minha vida inteira à Astrologia, eu vivia no mundo empresarial tradicional. Eu tinha negócios, andava de terno e gravata e ganhava dinheiro no mercado corporativo, mas sentia todos os dias um vazio silencioso, como se eu estivesse <strong>vivendo fora do meu próprio propósito<\/strong>.<\/p>\n<p>Eu já estudava Astrologia a fundo, até que <span class=\"hl-amber\">num sábado de manhã, antes de tomar qualquer decisão drástica de vender minhas empresas, eu limpei a mesa da sala da minha casa, coloquei duas cadeiras simples, dobrei o terno no armário e sentei ali de chinelo e camiseta para atender a minha primeira cliente lendo o Mapa dela<\/span>.<\/p>\n<p>Ali eu percebi uma coisa que mudou a minha vida inteira: <strong>quando a gente tira o misticismo confuso da frente e traduz o Mapa na língua da vida real, até na língua da Dona Neusa, de forma clara, humana e direta<\/strong>, <span class=\"hl-amber\">a vida da pessoa destrava na sua frente em uma hora, resolvendo o que anos de tentativa e erro não conseguiram resolver<\/span>. Em um ano, eu vendi todas as minhas empresas tradicionais para viver cem por cento dessa missão.<\/p>", "img": "assets/slides/slide_09.jpg"}, {"num": 10, "act": "PILAR 04 • O MÉTODO PRÁTICO SEM DECOREBA", "title": "As 3 Engrenagens da Vida Real", "cue": "01. Planetas (O Quê?) • 02. Signos (Como?) • 03. Casas + Trânsitos (Onde e Quando?)", "raw_script": "Olha na tela como a lógica dessas **três engrenagens vivas** do seu Mapa é limpa e direta:\n\nA primeira engrenagem são os **Planetas**, que respondem **O Quê** está se movendo dentro de você: o **Sol** é a sua consciência central, a **Lua** é o seu mundo emocional e segurança, **Mercúrio** é a sua mente e negociação, **Vênus** é o que você valoriza no amor e no dinheiro, **Marte** é a sua força de execução, **Júpiter** é onde você expande e **Saturno** é onde a vida exige estrutura e maturidade. A segunda engrenagem são os **Signos**, que mostram **Como** essa força se expressa, revelando seus talentos naturais. E a terceira engrenagem são as **Casas Astrológicas cruzadas com os Trânsitos do céu de hoje**, mostrando exatamente **Onde e Quando** o jogo está acontecendo na sua rotina.\n\nImagina a diferença prática na sua vida amanhã cedo: em vez de acordar ansioso tentando adivinhar se essa é a semana certa para assinar um contrato, cobrar um posicionamento no relacionamento ou lançar uma ideia nova, **você bate o olho nos seus trânsitos do dia em trinta segundos**. ==Se Saturno está pressionando a sua Casa Dois, a ordem do céu é enxugar custos, proteger o caixa e ter paciência, porque quem tenta dar passo maior que a perna nessa janela quebra. Agora, quando Júpiter ou Urano abrem um trígono na sua área de carreira e recursos, você sabe que a janela abriu e avança com força total enquanto todo mundo lá fora está hesitando.== A dúvida seca, a ansiedade vai embora e a decisão sai limpa. Me diz aqui no chat: **qual área da sua vida hoje mais precisa dessa clareza de tempo certo? Escreve aqui se é PROSPERIDADE, CARREIRA ou RELACIONAMENTOS.**", "html_script": "<p>Olha na tela como a lógica dessas <strong>três engrenagens vivas<\/strong> do seu Mapa é limpa e direta:<\/p>\n<p>A primeira engrenagem são os <strong>Planetas<\/strong>, que respondem <strong>O Quê<\/strong> está se movendo dentro de você: o <strong>Sol<\/strong> é a sua consciência central, a <strong>Lua<\/strong> é o seu mundo emocional e segurança, <strong>Mercúrio<\/strong> é a sua mente e negociação, <strong>Vênus<\/strong> é o que você valoriza no amor e no dinheiro, <strong>Marte<\/strong> é a sua força de execução, <strong>Júpiter<\/strong> é onde você expande e <strong>Saturno<\/strong> é onde a vida exige estrutura e maturidade. A segunda engrenagem são os <strong>Signos<\/strong>, que mostram <strong>Como<\/strong> essa força se expressa, revelando seus talentos naturais. E a terceira engrenagem são as <strong>Casas Astrológicas cruzadas com os Trânsitos do céu de hoje<\/strong>, mostrando exatamente <strong>Onde e Quando<\/strong> o jogo está acontecendo na sua rotina.<\/p>\n<p>Imagina a diferença prática na sua vida amanhã cedo: em vez de acordar ansioso tentando adivinhar se essa é a semana certa para assinar um contrato, cobrar um posicionamento no relacionamento ou lançar uma ideia nova, <strong>você bate o olho nos seus trânsitos do dia em trinta segundos<\/strong>. <span class=\"hl-amber\">Se Saturno está pressionando a sua Casa Dois, a ordem do céu é enxugar custos, proteger o caixa e ter paciência, porque quem tenta dar passo maior que a perna nessa janela quebra. Agora, quando Júpiter ou Urano abrem um trígono na sua área de carreira e recursos, você sabe que a janela abriu e avança com força total enquanto todo mundo lá fora está hesitando.<\/span> A dúvida seca, a ansiedade vai embora e a decisão sai limpa. Me diz aqui no chat: <strong>qual área da sua vida hoje mais precisa dessa clareza de tempo certo? Escreve aqui se é PROSPERIDADE, CARREIRA ou RELACIONAMENTOS.<\/strong><\/p>", "img": "assets/slides/slide_10.jpg"}, {"num": 11, "act": "ATO III • ASTROLOGIA ELECIONAL NA PRÁTICA", "title": "Nada Nesta Data Foi Escolhido Por Acaso", "cue": "A revelação do bastidor: por que escolheu o dia 15 de novembro entre 18h e 19h30", "raw_script": "Tô vendo aqui no chat: Prosperidade, Carreira, Relacionamentos, as três juntas... E agora eu quero revelar pra vocês **um bastidor que arrepia qualquer pessoa que entende a seriedade desse conhecimento**. Olha pro relógio agora. Nós estamos nos aproximando das **dezenove e trinta deste domingo, dia quinze de novembro**. Vocês acham mesmo que eu escolhi o dia quinze de novembro e esse horário do início da noite só porque domingo é um dia tranquilo na agenda?\n\n**De jeito nenhum.** Lembra que eu contei agora há pouco que os antigos estrategistas, médicos e sábios nunca iniciavam um grande movimento sem antes **abrir o mapa do céu para escolher o minuto exato do nascimento daquela obra**?\n\n==No início deste mês, eu sentei com o nosso time, abri o mapa de novembro inteiro na tela e procurei qual era a janela mais rara e potente do ano para fazer nascer oficialmente o projeto mais importante da minha vida.== E quando eu coloquei no mapa o **dia quinze de novembro, exatamente nesta janela entre as dezoito horas e as dezenove e trinta**, eu falei na hora: ==“Cara, esse é o mapa do negócio. Não dá pra ignorar isso aqui. Tem que ser exatamente neste dia e neste horário.”==", "html_script": "<p>Tô vendo aqui no chat: Prosperidade, Carreira, Relacionamentos, as três juntas... E agora eu quero revelar pra vocês <strong>um bastidor que arrepia qualquer pessoa que entende a seriedade desse conhecimento<\/strong>. Olha pro relógio agora. Nós estamos nos aproximando das <strong>dezenove e trinta deste domingo, dia quinze de novembro<\/strong>. Vocês acham mesmo que eu escolhi o dia quinze de novembro e esse horário do início da noite só porque domingo é um dia tranquilo na agenda?<\/p>\n<p><strong>De jeito nenhum.<\/strong> Lembra que eu contei agora há pouco que os antigos estrategistas, médicos e sábios nunca iniciavam um grande movimento sem antes <strong>abrir o mapa do céu para escolher o minuto exato do nascimento daquela obra<\/strong>?<\/p>\n<p><span class=\"hl-amber\">No início deste mês, eu sentei com o nosso time, abri o mapa de novembro inteiro na tela e procurei qual era a janela mais rara e potente do ano para fazer nascer oficialmente o projeto mais importante da minha vida.<\/span> E quando eu coloquei no mapa o <strong>dia quinze de novembro, exatamente nesta janela entre as dezoito horas e as dezenove e trinta<\/strong>, eu falei na hora: <span class=\"hl-amber\">“Cara, esse é o mapa do negócio. Não dá pra ignorar isso aqui. Tem que ser exatamente neste dia e neste horário.”<\/span><\/p>", "img": "assets/slides/slide_11.jpg"}, {"num": 12, "act": "ATO III • O MAPA DO NASCIMENTO OFICIAL (15/11 ÀS 19H30)", "title": "A Egrégora do Despertar (19h30)", "cue": "Ascendente em Gêmeos + Urano • Trígono com Lua e Plutão em Aquário (Casa 9) • Casas 3 e 9 + MC em Peixes", "raw_script": "Olha pra tela e vê o que está desenhado no céu sobre as nossas cabeças exatamente agora, às **dezenove e trinta deste dia quinze de novembro**. Nós temos o ==Ascendente em Gêmeos com o planeta Urano cravado em cima do Ascendente==. Urano é o despertador do zodíaco, é o revolucionário, é a mente que enxerga dez anos na frente. E esse Urano no Ascendente está fazendo um ==trígono exato de ar com a Lua em conjunção com Plutão no signo de Aquário, lá na Casa Nove==, enquanto as **Casas Três e Nove** estão totalmente acesas, o **Sol brilha em Escorpião na Casa Seis** e o **Meio do Céu aponta para Peixes**.\n\nDeixa eu traduzir o tamanho disso que nós estamos vivendo juntos nesta sala agora. A **Casa Nove** ativada é a casa que traz as grandes respostas, que dá sentido para a vida e acaba com a escuridão do medo. A **Casa Três com Ascendente em Gêmeos** é a comunicação viva, intensa, onde ==ninguém fica mudo ou passa despercebido==, onde mentes inteligentes debatem ideias reais e crescem juntas.\n\nE aquela conjunção da **Lua com Plutão em Aquário** recebendo o raio de Urano é, literalmente, o mapa daquilo que eu chamo de **Egrégora do Despertar**. ==Lua com Plutão em Aquário tem um único cimento: pertencimento verdadeiro ao grupo.== É o senso de clã, de proteção dos nossos, de encontrar finalmente um refúgio seguro de pessoas lúcidas no meio de um mundo barulhento, guiado por um **Meio do Céu em Peixes** que coloca todo esse conhecimento a serviço de algo maior.", "html_script": "<p>Olha pra tela e vê o que está desenhado no céu sobre as nossas cabeças exatamente agora, às <strong>dezenove e trinta deste dia quinze de novembro<\/strong>. Nós temos o <span class=\"hl-amber\">Ascendente em Gêmeos com o planeta Urano cravado em cima do Ascendente<\/span>. Urano é o despertador do zodíaco, é o revolucionário, é a mente que enxerga dez anos na frente. E esse Urano no Ascendente está fazendo um <span class=\"hl-amber\">trígono exato de ar com a Lua em conjunção com Plutão no signo de Aquário, lá na Casa Nove<\/span>, enquanto as <strong>Casas Três e Nove<\/strong> estão totalmente acesas, o <strong>Sol brilha em Escorpião na Casa Seis<\/strong> e o <strong>Meio do Céu aponta para Peixes<\/strong>.<\/p>\n<p>Deixa eu traduzir o tamanho disso que nós estamos vivendo juntos nesta sala agora. A <strong>Casa Nove<\/strong> ativada é a casa que traz as grandes respostas, que dá sentido para a vida e acaba com a escuridão do medo. A <strong>Casa Três com Ascendente em Gêmeos<\/strong> é a comunicação viva, intensa, onde <span class=\"hl-amber\">ninguém fica mudo ou passa despercebido<\/span>, onde mentes inteligentes debatem ideias reais e crescem juntas.<\/p>\n<p>E aquela conjunção da <strong>Lua com Plutão em Aquário<\/strong> recebendo o raio de Urano é, literalmente, o mapa daquilo que eu chamo de <strong>Egrégora do Despertar<\/strong>. <span class=\"hl-amber\">Lua com Plutão em Aquário tem um único cimento: pertencimento verdadeiro ao grupo.<\/span> É o senso de clã, de proteção dos nossos, de encontrar finalmente um refúgio seguro de pessoas lúcidas no meio de um mundo barulhento, guiado por um <strong>Meio do Céu em Peixes<\/strong> que coloca todo esse conhecimento a serviço de algo maior.<\/p>", "img": "assets/slides/slide_12.jpg"}, {"num": 13, "act": "ATO IV • PORTAS ABERTAS OFICIALMENTE", "title": "Comunidade Astrowake (A Solidão de Quem Desperta)", "cue": "Declaração de nascimento oficial da Comunidade • A dor silenciosa de se sentir um estranho no ninho", "raw_script": "É debaixo deste céu exato, neste minuto que nós calculamos no mapa, que eu declaro **oficialmente nascida e de portas abertas a Comunidade Astrowake**.\n\nPresta muita atenção no que significa o que está nascendo aqui hoje. Durante anos, muita gente me pediu um ambiente onde a Astrologia deixasse de ser apenas aulas gravadas que você assiste sozinho no seu quarto e se tornasse **um organismo vivo**. E deixa eu tocar num ponto que está escrito nessa tela e que provavelmente você já sente na pele há muito tempo, mas quase ninguém tem coragem de dizer em voz alta: ==começar a enxergar a vida com mais profundidade dá uma sensação absurda de solidão==.\n\nQuando você sai do piloto automático e começa a questionar o porquê das coisas, parece que você vira um **estranho no próprio ninho**. As conversas nas rodas de amigos ficam rasas. O ambiente de trabalho parece um teatro onde todo mundo finge o tempo inteiro. Até dentro da família fica difícil explicar o que você pensa sem ser julgado.", "html_script": "<p>É debaixo deste céu exato, neste minuto que nós calculamos no mapa, que eu declaro <strong>oficialmente nascida e de portas abertas a Comunidade Astrowake<\/strong>.<\/p>\n<p>Presta muita atenção no que significa o que está nascendo aqui hoje. Durante anos, muita gente me pediu um ambiente onde a Astrologia deixasse de ser apenas aulas gravadas que você assiste sozinho no seu quarto e se tornasse <strong>um organismo vivo<\/strong>. E deixa eu tocar num ponto que está escrito nessa tela e que provavelmente você já sente na pele há muito tempo, mas quase ninguém tem coragem de dizer em voz alta: <span class=\"hl-amber\">começar a enxergar a vida com mais profundidade dá uma sensação absurda de solidão<\/span>.<\/p>\n<p>Quando você sai do piloto automático e começa a questionar o porquê das coisas, parece que você vira um <strong>estranho no próprio ninho<\/strong>. As conversas nas rodas de amigos ficam rasas. O ambiente de trabalho parece um teatro onde todo mundo finge o tempo inteiro. Até dentro da família fica difícil explicar o que você pensa sem ser julgado.<\/p>", "img": "assets/slides/slide_13.jpg"}, {"num": 14, "act": "ATO IV • A FORÇA DO AMBIENTE CERTO", "title": "A Regra da Evolução e O Seu Lugar", "cue": "Por que ninguém sustenta a evolução sozinho • A Comunidade como ambiente seguro de gente lúcida", "raw_script": "E aqui existe uma verdade humana que explica por que tanta gente boa acaba travando no meio do caminho: ==ninguém consegue sustentar a própria evolução caminhando sozinho no meio de pessoas que só puxam você de volta para o automático. Mais cedo ou mais tarde, o cansaço bate e o mundo te engole.==\n\nVocê não precisa continuar se diminuindo para caber em lugares que já ficaram pequenos para a sua consciência. **Foi exatamente por isso que eu construí a Comunidade Astrowake.**\n\nUm ecossistema vivo de doze meses onde você finalmente encontra a sua turma: ==gente lúcida, inteligente e com os pés no chão==, que olha para a vida, os negócios e as relações na mesma frequência que você. Um lugar desenhado tanto para você que quer usar a Astrologia como bússola prática para destravar sua própria prosperidade, sua carreira e seus relacionamentos, quanto para você que é terapeuta, psicólogo, médico, empresário ou astrólogo e quer elevar o nível das suas decisões e atendimentos.", "html_script": "<p>E aqui existe uma verdade humana que explica por que tanta gente boa acaba travando no meio do caminho: <span class=\"hl-amber\">ninguém consegue sustentar a própria evolução caminhando sozinho no meio de pessoas que só puxam você de volta para o automático. Mais cedo ou mais tarde, o cansaço bate e o mundo te engole.<\/span><\/p>\n<p>Você não precisa continuar se diminuindo para caber em lugares que já ficaram pequenos para a sua consciência. <strong>Foi exatamente por isso que eu construí a Comunidade Astrowake.<\/strong><\/p>\n<p>Um ecossistema vivo de doze meses onde você finalmente encontra a sua turma: <span class=\"hl-amber\">gente lúcida, inteligente e com os pés no chão<\/span>, que olha para a vida, os negócios e as relações na mesma frequência que você. Um lugar desenhado tanto para você que quer usar a Astrologia como bússola prática para destravar sua própria prosperidade, sua carreira e seus relacionamentos, quanto para você que é terapeuta, psicólogo, médico, empresário ou astrólogo e quer elevar o nível das suas decisões e atendimentos.<\/p>", "img": "assets/slides/slide_14.jpg"}, {"num": 15, "act": "ATO IV • ASTROLOGIA PRÁTICA NA VIDA REAL", "title": "O Fim do 'Modo Difícil' (Lá Fora vs. Aqui Dentro)", "cue": "Contraste entre quem bate cabeça no Modo Difícil lá fora vs. os 5.000 anos de observação prática aqui dentro", "raw_script": "Olha para o contraste dessa lâmina, porque ele resume o que muda na sua vida a partir de hoje. A maioria das pessoas lá fora passa a vida inteira jogando no **Modo Difícil**. Elas tomam decisões de carreira e dinheiro no escuro, na base da tentativa e erro. Entram e saem de relacionamentos repetindo exatamente o mesmo padrão de desgaste emocional. E brigam contra o próprio tempo: tentam acelerar quando o ciclo pede cautela, e travam com medo justo quando a janela de oportunidade está escancarada.\n\nAgora olha como funciona para quem caminha dentro da **Comunidade Astrowake**. ==Aqui nós usamos a Astrologia de forma séria, limpa e aplicável, baseada em cinco mil anos de observação prática do comportamento humano e dos ciclos do tempo, sem tabelas confusas e sem misticismo vazio.==\n\nEm vez de adivinhar no escuro, você bate o olho na estrutura de um sócio, de um cliente, do seu cônjuge ou de um filho e **entende imediatamente como aquela pessoa funciona**. E, principalmente, você passa a enxergar o calendário real da sua vida, sabendo com meses de antecedência **quando avançar, quando proteger o caixa e quando encerrar o que já estagnou**.", "html_script": "<p>Olha para o contraste dessa lâmina, porque ele resume o que muda na sua vida a partir de hoje. A maioria das pessoas lá fora passa a vida inteira jogando no <strong>Modo Difícil<\/strong>. Elas tomam decisões de carreira e dinheiro no escuro, na base da tentativa e erro. Entram e saem de relacionamentos repetindo exatamente o mesmo padrão de desgaste emocional. E brigam contra o próprio tempo: tentam acelerar quando o ciclo pede cautela, e travam com medo justo quando a janela de oportunidade está escancarada.<\/p>\n<p>Agora olha como funciona para quem caminha dentro da <strong>Comunidade Astrowake<\/strong>. <span class=\"hl-amber\">Aqui nós usamos a Astrologia de forma séria, limpa e aplicável, baseada em cinco mil anos de observação prática do comportamento humano e dos ciclos do tempo, sem tabelas confusas e sem misticismo vazio.<\/span><\/p>\n<p>Em vez de adivinhar no escuro, você bate o olho na estrutura de um sócio, de um cliente, do seu cônjuge ou de um filho e <strong>entende imediatamente como aquela pessoa funciona<\/strong>. E, principalmente, você passa a enxergar o calendário real da sua vida, sabendo com meses de antecedência <strong>quando avançar, quando proteger o caixa e quando encerrar o que já estagnou<\/strong>.<\/p>", "img": "assets/slides/slide_15.jpg"}, {"num": 16, "act": "ATO IV • OS 3 MOTORES DOS PRÓXIMOS 12 MESES", "title": "Por Que Uma Comunidade Ativa? (Os 3 Motores)", "cue": "01. Pertencimento Real • 02. Aplicativo da Bússola (30s) • 03. 24 Encontros Quinzenais Ao Vivo", "raw_script": "E por que eu fiz questão de criar uma **Comunidade Ativa de doze meses** em vez de entregar apenas um curso gravado? Porque a última coisa que você precisa hoje é comprar mais um curso para estudar sozinho num quarto escuro. ==Para transformar sua realidade de verdade até 2027, você precisa de três motores vivos funcionando juntos durante o ano inteiro.==\n\nO **primeiro motor é o Pertencimento Real**: você passa a estar cercado diariamente de empresários, terapeutas, profissionais liberais e pessoas despertas que falam a sua língua, trocam experiências reais, fecham parcerias e se apoiam nas mudanças de fase da vida.\n\nO **segundo motor é a Velocidade de Decisão no Bolso**: você tem o nosso **Aplicativo da Bússola** na palma da mão, cruzando o seu Mapa Natal com os trânsitos do dia em trinta segundos, sem precisar decorar nada.\n\nE o **terceiro motor é o Direcionamento Ao Vivo Comigo**: ==a cada quinze dias nós sentamos juntos na mesma sala ao vivo== para abrirmos mapas reais, analisarmos casos práticos e decodificarmos a realidade lado a lado.", "html_script": "<p>E por que eu fiz questão de criar uma <strong>Comunidade Ativa de doze meses<\/strong> em vez de entregar apenas um curso gravado? Porque a última coisa que você precisa hoje é comprar mais um curso para estudar sozinho num quarto escuro. <span class=\"hl-amber\">Para transformar sua realidade de verdade até 2027, você precisa de três motores vivos funcionando juntos durante o ano inteiro.<\/span><\/p>\n<p>O <strong>primeiro motor é o Pertencimento Real<\/strong>: você passa a estar cercado diariamente de empresários, terapeutas, profissionais liberais e pessoas despertas que falam a sua língua, trocam experiências reais, fecham parcerias e se apoiam nas mudanças de fase da vida.<\/p>\n<p>O <strong>segundo motor é a Velocidade de Decisão no Bolso<\/strong>: você tem o nosso <strong>Aplicativo da Bússola<\/strong> na palma da mão, cruzando o seu Mapa Natal com os trânsitos do dia em trinta segundos, sem precisar decorar nada.<\/p>\n<p>E o <strong>terceiro motor é o Direcionamento Ao Vivo Comigo<\/strong>: <span class=\"hl-amber\">a cada quinze dias nós sentamos juntos na mesma sala ao vivo<\/span> para abrirmos mapas reais, analisarmos casos práticos e decodificarmos a realidade lado a lado.<\/p>", "img": "assets/slides/slide_16.jpg"}, {"num": 17, "act": "O PASSAPORTE COMPLETO • PILARES 01 A 03", "title": "Durante 12 Meses Teremos... (Parte 1: Pilares 01, 02 e 03)", "cue": "Entregáveis 01 (24 Encontros Ao Vivo), 02 (App da Bússola no celular) e 03 (Formação Completa Astrowake)", "raw_script": "Deixa eu te mostrar na tela cada um dos seis pilares que você passa a ter nas mãos a partir de hoje pelos próximos doze meses. Nesta tela estão os três primeiros.\n\nO **primeiro pilar são os nossos vinte e quatro encontros quinzenais ao vivo, direto comigo, ao longo de um ano inteiro**, somados à nossa comunidade ativa no WhatsApp. Sabe quando você está diante de uma encruzilhada real, seja uma mudança profissional, um movimento financeiro importante, um trânsito tenso no relacionamento ou o mapa de um caso que você quer destravar, e tudo o que você queria era poder abrir esse mapa na mesa para a gente analisar junto? ==É exatamente isso que acontece nos nossos encontros quinzenais. Nós abrimos mapas reais dos membros na tela, lemos o céu da quinzena, debatemos interpretações, trazemos convidados de peso e construímos um clã onde ninguém passa despercebido.==\n\nO **segundo pilar é o Aplicativo da Bússola direto no seu celular**, para você nunca mais ser engolido pela correria numa terça-feira às nove da manhã. Mesmo que hoje você esteja começando do absoluto zero, você abre o aplicativo pela manhã enquanto toma o seu café e, ==em trinta segundos, ele cruza automaticamente o seu Mapa Natal com a posição exata dos planetas naquele dia==. Com a nossa inteligência integrada treinada na minha metodologia, você vê na hora qual área da sua vida está ativada, até que horas dura uma pressão emocional ou mental e se o dia pede avanço comercial, negociação ou recolhimento estratégico. É literalmente tirar o peso da dúvida das suas costas todos os dias do ano.\n\nE o **terceiro pilar é a Formação Completa em Astrologia, o Astrowake**, liberada imediatamente para você ter autonomia intelectual completa. Nela você domina a engenharia profunda do ser humano: como funcionam os planetas, os signos, as casas, os aspectos, a leitura de prosperidade, vocação, sombras e relacionamentos, tudo ensinado de forma lógica, visual e aplicável desde a primeira aula, tanto para governar sua própria vida quanto para atender profissionalmente.", "html_script": "<p>Deixa eu te mostrar na t    }\n    .studio-h1 span {\n      color: var(--amber);\n    }\n\n    /* Teleprompter Controls Group */\n    .ctrl-group {\n      display: flex;\n      align-items: center;\n      gap: 10px;\n    }\n    .studio-btn {\n      background: var(--bg-card);\n      color: var(--offwhite);\n      border: 1px solid var(--line);\n      padding: 8px 14px;\n      border-radius: 8px;\n      font-size: 13px;\n      font-weight: 700;\n      cursor: pointer;\n      transition: all 0.16s ease;\n      display: inline-flex;\n      align-items: center;\n      gap: 6px;\n    }\n    .studio-btn:hover {\n      border-color: var(--amber);\n      color: var(--amber);\n    }\n    .studio-btn.active-toggle {\n      background: var(--amber);\n      color: #07080B;\n      border-color: var(--amber);\n    }\n    .speed-box {\n      display: flex;\n      align-items: center;\n      gap: 8px;\n      background: var(--bg-card);\n      padding: 6px 12px;\n      border-radius: 8px;\n      border: 1px solid var(--line);\n      font-size: 12px;\n      font-weight: 700;\n      color: var(--muted);\n    }\n    .speed-box input[type=\"range\"] {\n      width: 85px;\n      accent-color: var(--amber);\n      cursor: pointer;\n    }\n\n    /* Main Studio Split Layout */\n    #studio-body {\n      display: grid;\n      grid-template-columns: 1fr 390px;\n      height: calc(100vh - 68px);\n      overflow: hidden;\n    }\n\n    /* Left Column: Continuous Full-Script Teleprompter Stream */\n    #prompter-column {\n      position: relative;\n      height: 100%;\n      overflow-y: auto;\n      padding: 40px 52px 55vh 52px;\n      scroll-behavior: smooth;\n    }\n    /* Eye-level Reading Guide Line */\n    #reading-guide {\n      position: fixed;\n      top: 230px;\n      left: 0;\n      width: calc(100% - 390px);\n      height: 0;\n      border-top: 2px dashed rgba(232, 168, 56, 0.28);\n      pointer-events: none;\n      z-index: 40;\n    }\n    #reading-guide::after {\n      content: \"\ud83d\udc41\ufe0f ZONA DE LEITURA\";\n      position: absolute;\n      right: 16px;\n      top: -22px;\n      font-size: 10px;\n      font-weight: 800;\n      color: rgba(232, 168, 56, 0.65);\n      background: rgba(7, 8, 11, 0.85);\n      padding: 2px 8px;\n      border-radius: 4px;\n      letter-spacing: 0.6px;\n    }\n\n    .prompter-intro-banner {\n      background: linear-gradient(90deg, rgba(232, 168, 56, 0.14), rgba(198, 92, 32, 0.08));\n      border: 1px solid rgba(232, 168, 56, 0.4);\n      border-radius: 12px;\n      padding: 16px 22px;\n      margin-bottom: 28px;\n      display: flex;\n      justify-content: space-between;\n      align-items: center;\n    }\n    .prompter-intro-banner h2 {\n      font-size: 16px;\n      color: var(--amber);\n      font-weight: 800;\n    }\n    .prompter-intro-banner p {\n      font-size: 13px;\n      color: var(--offwhite);\n      margin-top: 4px;\n    }\n\n    /* Individual Slide Script Block in Continuous Stream */\n    .script-block {\n      background: var(--bg-panel);\n      border: 2px solid var(--line);\n      border-left: 6px solid #323746;\n      border-radius: 14px;\n      padding: 26px 32px;\n      margin-bottom: 26px;\n      opacity: 0.36;\n      transition: opacity 0.28s ease, border-color 0.28s ease, background 0.28s ease, transform 0.28s ease, box-shadow 0.28s ease;\n      cursor: pointer;\n    }\n    .script-block:hover {\n      opacity: 0.72;\n    }\n    /* ACTIVE SLIDE BLOCK: Bold, Bright, Glowing Amber Indicator */\n    .script-block.active-slide {\n      opacity: 1;\n      background: var(--bg-active);\n      border-color: var(--amber);\n      border-left: 10px solid var(--amber);\n      box-shadow: 0 14px 45px rgba(232, 168, 56, 0.14);\n      transform: scale(1.006);\n    }\n\n    .block-header {\n      display: flex;\n      justify-content: space-between;\n      align-items: center;\n      margin-bottom: 16px;\n      padding-bottom: 12px;\n      border-bottom: 1px solid rgba(255, 255, 255, 0.09);\n      flex-wrap: wrap;\n      gap: 10px;\n    }\n    .block-badges {\n      display: flex;\n      align-items: center;\n      gap: 10px;\n    }\n    .slide-num-pill {\n      background: #282D3C;\n      color: var(--offwhite);\n      font-weight: 900;\n      font-size: 13px;\n      padding: 5px 12px;\n      border-radius: 6px;\n      letter-spacing: 0.5px;\n    }\n    .script-block.active-slide .slide-num-pill {\n      background: var(--amber);\n      color: #07080B;\n    }\n    .on-air-indicator {\n      display: none;\n      background: rgba(34, 197, 94, 0.2);\n      border: 1px solid var(--green);\n      color: #4ADE80;\n      font-size: 12px;\n      font-weight: 800;\n      padding: 4px 10px;\n      border-radius: 6px;\n      letter-spacing: 0.5px;\n    }\n    .script-block.active-slide .on-air-indicator {\n      display: inline-flex;\n      align-items: center;\n      gap: 5px;\n    }\n    .block-title {\n      font-size: 20px;\n      font-weight: 800;\n      color: var(--offwhite);\n    }\n    .script-block.active-slide .block-title {\n      color: var(--amber);\n    }\n    .block-cue {\n      font-size: 13px;\n      color: var(--muted);\n      background: rgba(0, 0, 0, 0.3);\n      padding: 6px 12px;\n      border-radius: 6px;\n      margin-bottom: 18px;\n      border-left: 3px solid var(--copper);\n    }\n\n    /* Script Paragraphs */\n    .block-content {\n      font-size: var(--font-size-script);\n      line-height: 1.62;\n      color: #D5D8E0;\n      font-weight: 500;\n    }\n    .script-block.active-slide .block-content {\n      color: #FFFFFF;\n      font-weight: 600;\n    }\n    .block-content p {\n      margin-bottom: 18px;\n    }\n    .block-content p:last-child {\n      margin-bottom: 0;\n    }\n    .block-content strong {\n      color: #FFFFFF;\n      font-weight: 800;\n      text-decoration: underline;\n      text-decoration-color: rgba(232, 168, 56, 0.55);\n      text-underline-offset: 4px;\n    }\n    .block-content .hl-amber {\n      background: rgba(232, 168, 56, 0.22);\n      color: #FFD175;\n      font-weight: 800;\n      padding: 2px 7px;\n      border-radius: 5px;\n    }\n\n    /* Right Sidebar: Live Slide Monitor + Quick Jump Index */\n    #monitor-sidebar {\n      background: var(--bg-panel);\n      border-left: 2px solid var(--line);\n      display: flex;\n      flex-direction: column;\n      height: 100%;\n      padding: 20px;\n      overflow-y: auto;\n      gap: 18px;\n    }\n    .monitor-card {\n      background: var(--bg-card);\n      border: 1px solid var(--line);\n      border-radius: 12px;\n      padding: 14px;\n    }\n    .monitor-label {\n      font-size: 12px;\n      font-weight: 800;\n      color: var(--amber);\n      letter-spacing: 0.6px;\n      margin-bottom: 8px;\n      display: flex;\n      justify-content: space-between;\n      align-items: center;\n    }\n    .monitor-img-wrap {\n      width: 100%;\n      aspect-ratio: 16 / 9;\n      background: #000;\n      border-radius: 8px;\n      overflow: hidden;\n      border: 2px solid var(--amber);\n      margin-bottom: 12px;\n    }\n    .monitor-img-wrap img {\n      width: 100%;\n      height: 100%;\n      object-fit: contain;\n      display: block;\n    }\n    .nav-buttons-big {\n      display: grid;\n      grid-template-columns: 1fr 1fr;\n      gap: 10px;\n    }\n    .nav-btn-big {\n      padding: 12px;\n      font-size: 14px;\n      font-weight: 800;\n      border-radius: 8px;\n      cursor: pointer;\n      border: 1px solid var(--line);\n      background: var(--bg-panel);\n      color: var(--offwhite);\n      transition: all 0.15s ease;\n    }\n    .nav-btn-big.next {\n      background: var(--amber);\n      color: #07080B;\n      border-color: var(--amber);\n    }\n    .nav-btn-big:hover {\n      filter: brightness(1.1);\n    }\n\n    /* Slide Quick Jump List */\n    .jump-list {\n      display: flex;\n      flex-direction: column;\n      gap: 6px;\n      max-height: 360px;\n      overflow-y: auto;\n      padding-right: 4px;\n    }\n    .jump-item {\n      padding: 8px 10px;\n      border-radius: 7px;\n      background: rgba(255,255,255,0.03);\n      border: 1px solid transparent;\n      font-size: 12px;\n      font-weight: 600;\n      color: var(--muted);\n      cursor: pointer;\n      display: flex;\n      align-items: center;\n      gap: 8px;\n      transition: all 0.15s ease;\n    }\n    .jump-item:hover {\n      color: var(--offwhite);\n      background: rgba(255,255,255,0.07);\n    }\n    .jump-item.active {\n      background: rgba(232, 168, 56, 0.18);\n      border-color: var(--amber);\n      color: var(--offwhite);\n      font-weight: 800;\n    }\n    .jump-item span.num {\n      color: var(--amber);\n      font-weight: 800;\n      min-width: 24px;\n    }\n  <\/style>\n<\/head>\n<body>\n\n  <header id=\"top-studio-bar\">\n    <div class=\"brand-title\">\n      <span class=\"live-pill\"><span class=\"live-dot\"><\/span> VIS\u00c3O EXCLUSIVA DO APRESENTADOR<\/span>\n      <div class=\"studio-h1\">\ud83c\udfac ROTEIRO COMPLETO DE FALA + <span>SEQU\u00caNCIA DE SLIDES<\/span><\/div>\n    <\/div>\n\n    <div class=\"ctrl-group\">\n      <button class=\"studio-btn\" id=\"btn-autoscroll\" title=\"Liga/Desliga a rolagem autom\u00e1tica cont\u00ednua do Teleprompter\">\u25b6 Rolagem Autom\u00e1tica: OFF<\/button>\n      <div class=\"speed-box\">\n        <span>Velocidade:<\/span>\n        <input type=\"range\" id=\"speed-slider\" min=\"1\" max=\"10\" step=\"1\" value=\"3\" />\n        <span id=\"speed-val\">3x<\/span>\n      <\/div>\n      <button class=\"studio-btn active-toggle\" id=\"btn-scroll-sync\" title=\"Quando ativado, rolar o texto com o mouse tamb\u00e9m destaca e avan\u00e7a o slide automaticamente\">\ud83d\udd17 Sincronizar Slide ao Rolar: ON<\/button>\n      <button class=\"studio-btn\" id=\"btn-font-dec\" title=\"Diminuir fonte\">A-<\/button>\n      <button class=\"studio-btn\" id=\"btn-font-inc\" title=\"Aumentar fonte\">A+<\/button>\n      <button class=\"studio-btn\" id=\"btn-open-clean-stage\" title=\"Abre a guia limpa de slides para compartilhar no Google Meet\">\ud83d\udda5\ufe0f Abrir Guia Limpa p/ Meet<\/button>\n    <\/div>\n  <\/header>\n\n  <div id=\"reading-guide\"><\/div>\n\n  <main id=\"studio-body\">\n    <!-- Continuous Full Script Stream (All 21 Slides) -->\n    <section id=\"prompter-column\">\n      <div class=\"prompter-intro-banner\">\n        <div>\n          <h2>COMO USAR NO GOOGLE MEET (PASSO A PASSO SIMPLES):<\/h2>\n          <p>1. Compartilhe no Google Meet <b>APENAS a Guia Limpa dos Slides<\/b> (os alunos ver\u00e3o somente os slides em tela cheia).<br/>\n             2. Mantenha <b>esta janela do Teleprompter<\/b> aberta para voc\u00ea: role livremente com o <b>scroll do mouse<\/b>, use as <b>setas \u25c0 \u25b6<\/b> ou ligue a <b>Rolagem Autom\u00e1tica<\/b>. O bloco do slide atual fica sempre <b>aceso em destaque dourado e negrito<\/b>!<\/p>\n        <\/div>\n      <\/div>\n\n      <div id=\"script-stream\"><\/div>\n    <\/section>\n\n    <!-- Right Monitor & Quick Navigation -->\n    <aside id=\"monitor-sidebar\">\n      <div class=\"monitor-card\">\n        <div class=\"monitor-label\">\n          <span>NO AR AGORA NO MEET<\/span>\n          <span id=\"mon-counter\">SLIDE 01 / 21<\/span>\n        <\/div>\n        <div class=\"monitor-img-wrap\">\n          <img id=\"mon-curr-img\" src=\"\" alt=\"Slide Atual\" />\n        <\/div>\n        <div class=\"nav-buttons-big\">\n          <button class=\"nav-btn-big\" id=\"mon-prev\">\u25c0 Anterior (\u2190)<\/button>\n          <button class=\"nav-btn-big next\" id=\"mon-next\">Pr\u00f3ximo (\u2192) \u25b6<\/button>\n        <\/div>\n      <\/div>\n\n      <div class=\"monitor-card\">\n        <div class=\"monitor-label\">\n          <span>PR\u00d3XIMO SLIDE NA FILA<\/span>\n          <span id=\"mon-next-num\" style=\"color:var(--muted);\">02 / 21<\/span>\n        <\/div>\n        <div class=\"monitor-img-wrap\" style=\"border-color:var(--line);opacity:0.75;margin-bottom:0;\">\n          <img id=\"mon-next-img\" src=\"\" alt=\"Pr\u00f3ximo Slide\" />\n        <\/div>\n      <\/div>\n\n      <div class=\"monitor-card\" style=\"flex:1;display:flex;flex-direction:column;\">\n        <div class=\"monitor-label\">\n          <span>\u00cdNDICE R\u00c1PIDO (21 SLIDES)<\/span>\n          <span style=\"color:var(--muted);font-weight:600;\">Clique p/ ir<\/span>\n        <\/div>\n        <div class=\"jump-list\" id=\"jump-list\"><\/div>\n      <\/div>\n    <\/aside>\n  <\/main>\n\n  <script>\n    const SLIDES = window.opener.SLIDES;\n    let currentIndex = 0;\n    let autoScrolling = false;\n    let scrollSpeed = 3;\n    let syncSlideOnScroll = true;\n    let programmaticScroll = false;\n    let fontSize = 26;\n\n    const prompterCol = document.getElementById('prompter-column');\n    const streamEl = document.getElementById('script-stream');\n    const jumpListEl = document.getElementById('jump-list');\n    const monCounter = document.getElementById('mon-counter');\n    const monCurrImg = document.getElementById('mon-curr-img');\n    const monNextImg = document.getElementById('mon-next-img');\n    const monNextNum = document.getElementById('mon-next-num');\n\n    // Cross-tab communication channel so Teleprompter and Clean Slide Tab stay 100% synced\n    const channel = ('BroadcastChannel' in window) ? new BroadcastChannel('astrowake_presentation_sync') : null;\n\n    // Build all 21 continuous blocks + quick jump list\n    SLIDES.forEach((s, idx) => {\n      const numPad = String(s.num).padStart(2, '0');\n      const block = document.createElement('article');\n      block.className = 'script-block' + (idx === 0 ? ' active-slide' : '');\n      block.id = 'script-block-' + idx;\n      block.dataset.index = idx;\n      block.innerHTML = `\n        <div class=\"block-header\">\n          <div class=\"block-badges\">\n            <span class=\"slide-num-pill\">SLIDE ${numPad} / 21<\/span>\n            <span class=\"on-air-indicator\">\u25cf FALANDO AGORA (NO AR)<\/span>\n            <span class=\"block-title\">${s.title}<\/span>\n          <\/div>\n          <span style=\"font-size:12px;font-weight:700;color:var(--muted);\">${s.act}<\/span>\n        <\/div>\n        <div class=\"block-cue\">\ud83d\udca1 <b>Foco desta l\u00e2mina:<\/b> ${s.cue}<\/div>\n        <div class=\"block-content\">${s.html_script}<\/div>\n      `;\n      block.addEventListener('click', () => {\n        setActiveSlide(idx, true, true);\n      });\n      streamEl.appendChild(block);\n\n      const jItem = document.createElement('div');\n      jItem.className = 'jump-item' + (idx === 0 ? ' active' : '');\n      jItem.id = 'jump-item-' + idx;\n      jItem.innerHTML = `<span class=\"num\">${numPad}<\/span> <span>${s.title}<\/span>`;\n      jItem.addEventListener('click', () => {\n        setActiveSlide(idx, true, true);\n      });\n      jumpListEl.appendChild(jItem);\n    });\n\n    function updateMonitorUI() {\n      const s = SLIDES[currentIndex];\n      const numPad = String(s.num).padStart(2, '0');\n      monCounter.textContent = `SLIDE ${numPad} / 21`;\n      monCurrImg.src = s.img;\n\n      if (currentIndex + 1 < SLIDES.length) {\n        const nextS = SLIDES[currentIndex + 1];\n        monNextNum.textContent = `SLIDE ${String(nextS.num).padStart(2, '0')} / 21`;\n        monNextImg.src = nextS.img;\n        monNextImg.style.opacity = '1';\n      } else {\n        monNextNum.textContent = 'FIM DA AULA';\n        monNextImg.style.opacity = '0.2';\n      }\n    }\n\n    function setActiveSlide(index, shouldScrollToBlock = true, broadcast = true) {\n      if (index < 0 || index >= SLIDES.length) return;\n      document.getElementById('script-block-' + currentIndex).classList.remove('active-slide');\n      document.getElementById('jump-item-' + currentIndex).classList.remove('active');\n\n      currentIndex = index;\n\n      const activeBlock = document.getElementById('script-block-' + currentIndex);\n      const activeJump = document.getElementById('jump-item-' + currentIndex);\n      activeBlock.classList.add('active-slide');\n      activeJump.classList.add('active');\n      activeJump.scrollIntoView({ block: 'nearest', behavior: 'smooth' });\n\n      updateMonitorUI();\n\n      if (shouldScrollToBlock) {\n        programmaticScroll = true;\n        const targetTop = activeBlock.offsetTop - 150;\n        prompterCol.scrollTo({ top: Math.max(0, targetTop), behavior: 'smooth' });\n        setTimeout(() => { programmaticScroll = false; }, 550);\n      }\n\n      if (broadcast) {\n        if (channel) channel.postMessage({ type: 'GO_TO_SLIDE', index: currentIndex });\n        try {\n          localStorage.setItem('astrowake_active_slide', JSON.stringify({ index: currentIndex, ts: Date.now() }));\n        } catch (e) {}\n        if (window.opener && !window.opener.closed && typeof window.opener.goToSlideFromTeleprompter === 'function') {\n          window.opener.goToSlideFromTeleprompter(currentIndex);\n        }\n      }\n    }\n\n    // Listen for slide changes coming from the Clean Slide Tab\n    if (channel) {\n      channel.onmessage = (ev) => {\n        if (ev.data && ev.data.type === 'SLIDE_CHANGED_FROM_STAGE' && ev.data.index !== currentIndex) {\n          setActiveSlide(ev.data.index, true, false);\n        }\n      };\n    }\n    window.addEventListener('storage', (ev) => {\n      if (ev.key === 'astrowake_stage_slide' && ev.newValue) {\n        try {\n          const data = JSON.parse(ev.newValue);\n          if (typeof data.index === 'number' && data.index !== currentIndex) {\n            setActiveSlide(data.index, true, false);\n          }\n        } catch (e) {}\n      }\n    });\n\n    // Expose direct hook for opener window\n    window.syncFromStage = function(idx) {\n      if (idx !== currentIndex) {\n        setActiveSlide(idx, true, false);\n      }\n    };\n\n    // Detect which slide block is in the Eye-Level Reading Zone when scrolling manually or via Auto-Scroll\n    prompterCol.addEventListener('scroll', () => {\n      if (!syncSlideOnScroll || programmaticScroll) return;\n      const readingLineY = prompterCol.scrollTop + 210;\n      let bestIdx = currentIndex;\n      for (let i = 0; i < SLIDES.length; i++) {\n        const el = document.getElementById('script-block-' + i);\n        const top = el.offsetTop;\n        const bottom = top + el.offsetHeight;\n        if (readingLineY >= top && readingLineY <= bottom) {\n          bestIdx = i;\n          break;\n        }\n      }\n      if (bestIdx !== currentIndex) {\n        setActiveSlide(bestIdx, false, true);\n      }\n    });\n\n    // Auto-scroll loop\n    const btnAutoScroll = document.getElementById('btn-autoscroll');\n    const speedSlider = document.getElementById('speed-slider');\n    const speedVal = document.getElementById('speed-val');\n\n    speedSlider.addEventListener('input', () => {\n      scrollSpeed = Number(speedSlider.value);\n      speedVal.textContent = scrollSpeed + 'x';\n    });\n\n    btnAutoScroll.addEventListener('click', () => {\n      autoScrolling = !autoScrolling;\n      btnAutoScroll.textContent = autoScrolling ? '\u23f8 Rolagem Autom\u00e1tica: ON' : '\u25b6 Rolagem Autom\u00e1tica: OFF';\n      btnAutoScroll.classList.toggle('active-toggle', autoScrolling);\n    });\n\n    let lastFrameTime = performance.now();\n    function autoScrollStep(now) {\n      const dt = (now - lastFrameTime) / 1000;\n      lastFrameTime = now;\n      if (autoScrolling) {\n        // 14 pixels per second * speed multiplier\n        prompterCol.scrollTop += (12 * scrollSpeed) * dt;\n      }\n      requestAnimationFrame(autoScrollStep);\n    }\n    requestAnimationFrame(autoScrollStep);\n\n    // Toggle scroll-to-slide sync\n    const btnScrollSync = document.getElementById('btn-scroll-sync');\n    btnScrollSync.addEventListener('click', () => {\n      syncSlideOnScroll = !syncSlideOnScroll;\n      btnScrollSync.textContent = syncSlideOnScroll ? '\ud83d\udd17 Sincronizar Slide ao Rolar: ON' : '\ud83d\udd17 Sincronizar Slide ao Rolar: OFF';\n      btnScrollSync.classList.toggle('active-toggle', syncSlideOnScroll);\n    });\n\n    // Font size controls\n    document.getElementById('btn-font-inc').addEventListener('click', () => {\n      fontSize = Math.min(42, fontSize + 2);\n      document.documentElement.style.setProperty('--font-size-script', fontSize + 'px');\n    });\n    document.getElementById('btn-font-dec').addEventListener('click', () => {\n      fontSize = Math.max(18, fontSize - 2);\n      document.documentElement.style.setProperty('--font-size-script', fontSize + 'px');\n    });\n\n    // Open Clean Stage Tab for Google Meet\n    document.getElementById('btn-open-clean-stage').addEventListener('click', () => {\n      if (window.opener && !window.opener.closed) {\n        window.opener.focus();\n      } else {\n        window.open('index.html?view=slides', '_blank');\n      }\n    });\n\n    // Prev / Next buttons\n    document.getElementById('mon-prev').addEventListener('click', () => {\n      if (currentIndex > 0) setActiveSlide(currentIndex - 1, true, true);\n    });\n    document.getElementById('mon-next').addEventListener('click', () => {\n      if (currentIndex < SLIDES.length - 1) setActiveSlide(currentIndex + 1, true, true);\n    });\n\n    // Keyboard shortcuts inside Teleprompter Studio\n    window.addEventListener('keydown', (e) => {\n      if (e.key === 'ArrowRight') {\n        e.preventDefault();\n        if (currentIndex < SLIDES.length - 1) setActiveSlide(currentIndex + 1, true, true);\n      } else if (e.key === 'ArrowLeft') {\n        e.preventDefault();\n        if (currentIndex > 0) setActiveSlide(currentIndex - 1, true, true);\n      } else if (e.key === ' ') {\n        // Space toggles auto-scroll inside the teleprompter window!\n        e.preventDefault();\n        btnAutoScroll.click();\n      }\n    });\n\n    updateMonitorUI();\n  <\/script>\n<\/body>\n<\/html>\n";
    let currentIndex = 0;
    let teleprompterWin = null;
    let hudTimeout = null;

    const frame = document.getElementById('slide-frame');
    const counter = document.getElementById('slide-counter');
    const progressBar = document.getElementById('progress-bar');
    const gridModal = document.getElementById('grid-modal');
    const gridItems = document.getElementById('grid-items');

    const channel = ('BroadcastChannel' in window) ? new BroadcastChannel('astrowake_presentation_sync') : null;

    // Auto-hide HUD after 3 seconds of mouse inactivity so Google Meet projection is 100% clean
    function wakeHud() {
      document.body.classList.add('show-hud');
      clearTimeout(hudTimeout);
      hudTimeout = setTimeout(() => {
        document.body.classList.remove('show-hud');
      }, 3000);
    }
    window.addEventListener('mousemove', wakeHud);
    wakeHud();

    window.SLIDES.forEach((s, idx) => {
      const card = document.createElement('div');
      card.className = 'grid-card' + (idx === 0 ? ' current' : '');
      card.id = 'grid-card-' + idx;
      card.innerHTML = `
        <img src="${s.img}" alt="${s.title}" loading="lazy" />
        <div class="grid-card-label">
          <div>${s.title}</div>
          <span>${String(s.num).padStart(2, '0')}/21</span>
        </div>
      `;
      card.addEventListener('click', () => {
        goToSlide(idx, true);
        gridModal.classList.remove('open');
      });
      gridItems.appendChild(card);
    });

    function goToSlide(index, broadcast = true) {
      if (index < 0 || index >= window.SLIDES.length) return;
      document.getElementById('slide-el-' + currentIndex).classList.remove('active');
      document.getElementById('grid-card-' + currentIndex).classList.remove('current');
      currentIndex = index;
      document.getElementById('slide-el-' + currentIndex).classList.add('active');
      document.getElementById('grid-card-' + currentIndex).classList.add('current');

      const numStr = String(currentIndex + 1).padStart(2, '0');
      counter.textContent = `${numStr} / ${window.SLIDES.length}`;
      progressBar.style.width = `${((currentIndex + 1) / window.SLIDES.length) * 100}%`;

      if (broadcast) {
        if (channel) channel.postMessage({ type: 'SLIDE_CHANGED_FROM_STAGE', index: currentIndex });
        try {
          localStorage.setItem('astrowake_stage_slide', JSON.stringify({ index: currentIndex, ts: Date.now() }));
        } catch (e) {}
        if (teleprompterWin && !teleprompterWin.closed && typeof teleprompterWin.syncFromStage === 'function') {
          teleprompterWin.syncFromStage(currentIndex);
        }
      }
    }

    window.goToSlideFromTeleprompter = function(index) {
      if (index !== currentIndex) {
        goToSlide(index, false);
      }
    };

    if (channel) {
      channel.onmessage = (ev) => {
        if (ev.data && ev.data.type === 'GO_TO_SLIDE' && ev.data.index !== currentIndex) {
          goToSlide(ev.data.index, false);
        }
      };
    }
    window.addEventListener('storage', (ev) => {
      if (ev.key === 'astrowake_active_slide' && ev.newValue) {
        try {
          const data = JSON.parse(ev.newValue);
          if (typeof data.index === 'number' && data.index !== currentIndex) {
            goToSlide(data.index, false);
          }
        } catch (e) {}
      }
    });

    function nextSlide() {
      if (currentIndex < window.SLIDES.length - 1) goToSlide(currentIndex + 1, true);
    }
    function prevSlide() {
      if (currentIndex > 0) goToSlide(currentIndex - 1, true);
    }

    document.getElementById('btn-next').addEventListener('click', nextSlide);
    document.getElementById('btn-prev').addEventListener('click', prevSlide);
    document.getElementById('zone-next').addEventListener('click', nextSlide);
    document.getElementById('zone-prev').addEventListener('click', prevSlide);

    document.getElementById('btn-grid').addEventListener('click', () => {
      gridModal.classList.toggle('open');
    });
    document.getElementById('btn-close-grid').addEventListener('click', () => {
      gridModal.classList.remove('open');
    });

    document.getElementById('btn-fullscreen').addEventListener('click', toggleFullscreen);
    function toggleFullscreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(() => {});
      } else {
        document.exitFullscreen().catch(() => {});
      }
    }

    function openTeleprompterStudio() {
      if (teleprompterWin && !teleprompterWin.closed) {
        teleprompterWin.focus();
        if (typeof teleprompterWin.syncFromStage === 'function') {
          teleprompterWin.syncFromStage(currentIndex);
        }
        return;
      }
      teleprompterWin = window.open('', 'AstrowakeTeleprompterStudio', 'width=1280,height=860,menubar=no,toolbar=no,location=no,status=no');
      if (!teleprompterWin) {
        window.open('teleprompter.html', '_blank');
        return;
      }
      const doc = teleprompterWin.document;
      doc.open();
      doc.write(POPUP_STUDIO_HTML);
      doc.close();
      setTimeout(() => {
        if (teleprompterWin && typeof teleprompterWin.syncFromStage === 'function') {
          teleprompterWin.syncFromStage(currentIndex);
        }
      }, 300);
    }

    document.getElementById('btn-teleprompter').addEventListener('click', openTeleprompterStudio);

    window.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowRight' || e.key === ' ' || e.key === 'PageDown') {
        e.preventDefault();
        nextSlide();
      } else if (e.key === 'ArrowLeft' || e.key === 'PageUp') {
        e.preventDefault();
        prevSlide();
      } else if (e.key === 'g' || e.key === 'G') {
        gridModal.classList.toggle('open');
      } else if (e.key === 'Escape') {
        gridModal.classList.remove('open');
      } else if (e.key === 'f' || e.key === 'F') {
        toggleFullscreen();
      } else if (e.key === 't' || e.key === 'T') {
        openTeleprompterStudio();
      }
    });
  </script>
</body>
</html>
